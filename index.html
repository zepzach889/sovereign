<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sovereign — a chronicle of governance</title>
<style>
  :root{
    --ink:#0E141B; --console:#151E28; --console2:#1D2833; --console3:#243141; --line:#2A3947;
    --bone:#EAE4D6; --dim:#9BA6B0; --brass:#CBA24C; --brass-dim:#8B7333;
    --crisis:#C4553B; --good:#7CA86F; --blue:#6F93B8; --rust:#B5726A; --sage:#86A778; --violet:#9B86B8;
    --paper:#E7DCC2; --paper-ink:#2A2417; --paper-dim:#6B6045; --paper-line:#C9BB9A;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:radial-gradient(1200px 600px at 72% -12%,#1b2836 0%,transparent 62%),var(--ink);
    color:var(--bone);min-height:100vh;padding:20px;-webkit-font-smoothing:antialiased}
  button{font-family:inherit;cursor:pointer}
  :focus-visible{outline:2px solid var(--brass);outline-offset:2px;border-radius:3px}
  .wrap{max-width:1180px;margin:0 auto}

  header.top{display:flex;align-items:center;gap:14px;margin-bottom:16px}
  .seal{width:44px;height:44px;flex:none;border-radius:50%;border:1.5px solid var(--brass);color:var(--brass);
    display:grid;place-items:center;font-family:Georgia,serif;font-size:22px;box-shadow:inset 0 0 0 3px rgba(203,162,76,.12)}
  .top h1{font-family:Georgia,"Iowan Old Style",serif;font-size:26px;letter-spacing:.14em;margin:0;text-transform:uppercase;font-weight:600}
  .top .tag{margin:2px 0 0;color:var(--dim);font-size:11px;letter-spacing:.22em;text-transform:uppercase}
  .top .grow{flex:1}
  .ctrls{display:flex;gap:8px;flex-wrap:wrap}
  .ctrls button{background:transparent;color:var(--dim);border:1px solid var(--line);padding:7px 11px;border-radius:6px;font-size:12px}
  .ctrls button:hover{color:var(--bone);border-color:var(--brass-dim)}

  .setup{max-width:780px;margin:10px auto 0}
  .setup .lede{color:#c8cfd6;line-height:1.65;font-size:15px;border-left:2px solid var(--brass-dim);padding-left:16px;margin:0 0 24px}
  .setup .lede b{color:var(--brass);font-weight:600}
  .field{margin-bottom:18px}
  .field label{display:block;font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin-bottom:8px}
  .field .hint{font-size:12px;color:#6f7a84;margin-top:6px;font-style:italic}
  input[type=text]{width:100%;background:var(--console);border:1px solid var(--line);color:var(--bone);
    padding:12px 14px;border-radius:7px;font-size:16px;font-family:Georgia,serif}
  input[type=text]::placeholder{color:#5f6a74;font-style:italic}
  input[type=text]:focus{border-color:var(--brass);outline:none}
  .suggest{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
  .suggest button{background:var(--console2);border:1px solid var(--line);color:#b7c0c8;padding:5px 11px;border-radius:16px;font-size:12.5px}
  .suggest button:hover{border-color:var(--brass);color:var(--bone)}
  .radio-row{display:flex;gap:8px;flex-wrap:wrap}
  .radio-row button{flex:1;min-width:88px;background:var(--console2);border:1px solid var(--line);color:#b7c0c8;padding:9px;border-radius:7px;font-size:13px}
  .radio-row button.on{border-color:var(--brass);background:var(--console3);color:var(--bone)}
  .law-list{display:flex;flex-direction:column;gap:8px}
  .law-list button{text-align:left;background:var(--console2);border:1px solid var(--line);color:var(--bone);padding:11px 13px;border-radius:8px}
  .law-list button.on{border-color:var(--brass);background:var(--console3)}
  .law-list .ln{font-weight:600;font-size:14px}
  .law-list .ld{font-size:12px;color:var(--dim);margin-top:3px}
  .primary{width:100%;background:var(--brass);color:#20180a;border:none;padding:14px;border-radius:8px;font-size:15px;font-weight:650;letter-spacing:.03em;margin-top:6px}
  .primary:hover:not(:disabled){background:#d9b25e}
  .primary:disabled{background:var(--console2);color:#5f6a74;cursor:not-allowed}

  .grid{display:grid;grid-template-columns:294px minmax(0,1fr);gap:16px;align-items:start}
  .side{position:sticky;top:14px;background:var(--console);border:1px solid var(--line);border-radius:12px;padding:14px 15px;max-height:calc(100vh - 28px);overflow-y:auto}
  .side .nationname{font-size:19px}
  .side .yearrow{display:flex;justify-content:space-between;align-items:baseline;margin-top:4px;padding-bottom:10px;border-bottom:1px solid var(--line)}
  .side .meters{grid-template-columns:1fr;gap:9px;margin-top:11px}
  .side .budget{margin-top:2px}
  .side .facs{margin-top:11px;background:transparent;border:none;padding:0}
  .side::-webkit-scrollbar{width:7px}.side::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
  .console{background:var(--console);border:1px solid var(--line);border-radius:12px;padding:18px 20px}

  .nationbar{display:flex;justify-content:space-between;align-items:flex-start;padding-bottom:13px;border-bottom:1px solid var(--line);margin-bottom:14px}
  .nationname{font-family:Georgia,serif;font-size:22px;font-weight:600}
  .regime{color:var(--brass);font-size:11px;letter-spacing:.11em;text-transform:uppercase;margin-top:3px}
  .yearbox{text-align:right}
  .yearnum{font-family:ui-monospace,Menlo,monospace;font-size:23px;font-variant-numeric:tabular-nums}
  .yearlbl{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim)}

  /* phase strip */
  .phasestrip{display:flex;gap:6px;margin-bottom:14px}
  .phasestep{flex:1;text-align:center;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);
    border:1px solid var(--line);border-radius:6px;padding:6px 4px;background:var(--console2)}
  .phasestep.now{color:var(--brass);border-color:var(--brass-dim);background:var(--console3)}
  .phasestep.done{color:#5f6a74;text-decoration:line-through}

  .meters{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px 16px;margin-bottom:12px}
  .meter .mtop{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px}
  .meter .mlbl{font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--dim)}
  .meter .mval{font-family:ui-monospace,Menlo,monospace;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
  .track{height:6px;background:#0c1218;border-radius:4px;overflow:hidden;position:relative;border:1px solid #0a0f14}
  .fill{height:100%;border-radius:4px;transition:width .5s cubic-bezier(.4,0,.2,1)}
  .track.warn::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(45deg,transparent,transparent 5px,rgba(196,85,59,.35) 5px,rgba(196,85,59,.35) 10px)}
  .legit-src{font-size:10px;color:#6f7a84;margin-top:3px}

  .budget{display:flex;gap:14px;flex-wrap:wrap;align-items:center;background:var(--console2);border:1px solid var(--line);
    border-radius:9px;padding:10px 13px;margin-bottom:14px;font-size:12.5px}
  .budget .bx{display:flex;flex-direction:column}
  .budget .bx .bk{font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--dim)}
  .budget .bx .bv{font-family:ui-monospace,Menlo,monospace;font-size:14px;font-variant-numeric:tabular-nums}
  .budget .treasury-v.neg{color:var(--crisis)}
  .budget .net-pos{color:var(--good)} .budget .net-neg{color:var(--crisis)}
  .budget .grow{flex:1}
  .taxpill{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--brass-dim);color:var(--brass);border-radius:14px;padding:3px 10px}

  .gov{background:var(--console2);border:1px solid var(--line);border-radius:9px;padding:12px 14px;margin-bottom:14px}
  .gov .gt{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--brass-dim);margin-bottom:8px;display:flex;justify-content:space-between}
  .gov .gt .house{color:var(--dim);letter-spacing:.06em}
  .hos{font-family:Georgia,serif;font-size:15px}
  .hos small{color:var(--dim);font-family:inherit;font-size:12px}
  .regency{color:var(--violet);font-size:11.5px;margin-top:3px}
  .powerrow{display:flex;align-items:center;gap:9px;margin-top:7px;font-size:12px}
  .powerrow .pn{flex:none;width:150px;color:#c3ccd4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .powerrow .pn small{color:var(--dim)}
  .powerbar{flex:1;height:6px;background:#0c1218;border-radius:3px;overflow:hidden}
  .powerbar i{display:block;height:100%;background:var(--brass);border-radius:3px;transition:width .4s}
  .powerbar.chamber i{background:var(--blue)}
  .powerrow .pp{flex:none;font-family:ui-monospace,Menlo,monospace;color:var(--dim);width:34px;text-align:right}
  .rights{font-size:10.5px;color:var(--dim);margin-top:2px;margin-left:159px}

  /* family panel */
  .family{background:var(--console2);border:1px solid var(--line);border-radius:9px;padding:12px 14px;margin-bottom:14px}
  .family .gt{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--brass-dim);margin-bottom:8px;display:flex;justify-content:space-between}
  .family .lawpill{color:var(--dim);letter-spacing:.04em;text-transform:none}
  .person{display:flex;align-items:baseline;gap:8px;font-size:12.5px;margin-bottom:4px;color:#c3ccd4}
  .person .pr{color:var(--brass);font-size:10px;letter-spacing:.04em;text-transform:uppercase;width:104px;flex:none}
  .person .heirmark{color:var(--sage);font-size:10.5px}
  .person .rival{color:var(--crisis);font-size:10.5px}
  .person.dead{opacity:.45;text-decoration:line-through}

  .eyebrow{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--brass-dim)}
  .sit-title{font-family:Georgia,serif;font-size:20px;font-weight:600;margin:6px 0 10px;line-height:1.25}
  .sit-text{color:#cdd4db;line-height:1.62;font-size:14.5px;margin:0 0 16px}

  .tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
  .tabs button{background:var(--console2);border:1px solid var(--line);color:var(--dim);padding:7px 13px;border-radius:7px;font-size:12.5px}
  .tabs button.on{border-color:var(--brass);color:var(--bone);background:var(--console3)}

  .choices{display:flex;flex-direction:column;gap:9px}
  .choice{display:block;text-align:left;width:100%;background:var(--console2);border:1px solid var(--line);border-radius:8px;
    padding:11px 13px;color:var(--bone);font-size:14px;line-height:1.35;transition:border-color .15s,background .15s,transform .1s}
  .choice:hover:not(:disabled){border-color:var(--brass);background:#232f3b}
  .choice:active:not(:disabled){transform:translateY(1px)}
  .choice .cl{display:flex;align-items:baseline;gap:8px}
  .choice .cl .mk{font-family:Georgia,serif;color:var(--brass);font-size:13px;flex:none}
  .choice .cl .lbl{flex:1;font-weight:500}
  .choice .cl .rf{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--brass);border:1px solid var(--brass-dim);border-radius:14px;padding:2px 8px;flex:none}
  .choice .ch{font-size:12px;color:var(--dim);font-style:italic;margin-top:4px}
  .choice .costs{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
  .chip{font-size:11px;font-family:ui-monospace,Menlo,monospace;padding:2px 7px;border-radius:12px;border:1px solid var(--line);color:var(--dim)}
  .chip.up{color:var(--good);border-color:rgba(124,168,111,.35)}
  .chip.down{color:var(--crisis);border-color:rgba(196,85,59,.35)}
  .chip.fac{font-family:inherit}
  .chip.consent{color:var(--brass);border-color:var(--brass-dim)}
  .choice:disabled{opacity:.45;cursor:not-allowed}
  .choice .why{font-size:11px;color:var(--crisis);margin-top:6px}

  .reformcard{background:var(--console2);border:1px solid var(--line);border-radius:9px;padding:13px 15px;margin-bottom:10px}
  .reformcard.open{border-color:var(--brass-dim)}
  .reformcard .rhead{display:flex;align-items:baseline;gap:9px;cursor:pointer}
  .reformcard .rhead .rn{font-family:Georgia,serif;font-size:15.5px;font-weight:600;flex:1}
  .reformcard .rhead .rt{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--brass);border:1px solid var(--brass-dim);border-radius:14px;padding:2px 8px}
  .reformcard .rblurb{font-size:12.5px;color:var(--dim);margin-top:5px;line-height:1.5}
  .reformbody{margin-top:12px;border-top:1px solid var(--line);padding-top:12px}
  .prevblock{margin-bottom:11px}
  .prevblock .pl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--brass-dim);margin-bottom:5px}
  .prevblock .unlock{color:var(--good);font-size:13px;line-height:1.55}
  .prevblock .lock{color:var(--crisis);font-size:13px;line-height:1.55}
  .prevblock .neutral{color:#c3ccd4;font-size:13px;line-height:1.55}
  .powerpick{display:flex;align-items:center;gap:12px;margin:10px 0}
  .powerpick label{font-size:12px;color:var(--dim)}
  .powerpick input[type=range]{flex:1;accent-color:var(--brass)}
  .powerpick .pv{font-family:ui-monospace,Menlo,monospace;color:var(--brass);width:64px;text-align:right;font-size:13px}
  .enactbtn{background:var(--brass);color:#20180a;border:none;padding:10px 18px;border-radius:7px;font-size:13.5px;font-weight:600}
  .enactbtn:hover{background:#d9b25e}

  .taxtiers{display:flex;flex-direction:column;gap:8px}
  .taxtier{display:flex;align-items:center;gap:10px;background:var(--console2);border:1px solid var(--line);border-radius:8px;padding:10px 13px;text-align:left;color:var(--bone);width:100%}
  .taxtier:hover:not(:disabled){border-color:var(--brass)}
  .taxtier.cur{border-color:var(--brass-dim);opacity:.6}
  .taxtier:disabled{opacity:.5;cursor:not-allowed}
  .taxtier .tn{font-weight:600;flex:none;width:96px}
  .taxtier .td{font-size:12px;color:var(--dim);flex:1}
  .taxtier .tc{display:flex;gap:5px;flex-wrap:wrap;flex:none}
  .consentnote{font-size:12px;color:var(--brass);margin-top:10px}

  .outcome{border-top:1px solid var(--line);padding-top:15px;margin-top:4px}
  .fortune{display:inline-block;font-size:10px;letter-spacing:.2em;text-transform:uppercase;padding:4px 11px;border-radius:16px;margin-bottom:10px}
  .fortune.good{color:var(--good);border:1px solid rgba(124,168,111,.4)}
  .fortune.bad{color:var(--crisis);border:1px solid rgba(196,85,59,.4)}
  .outcome .ot{font-family:Georgia,serif;font-size:15.5px;line-height:1.62;color:#dfe4e9;margin:0 0 12px}
  .cont{background:transparent;color:var(--brass);border:1px solid var(--brass-dim);padding:11px 19px;border-radius:7px;font-size:13px;letter-spacing:.04em;font-weight:600}
  .cont:hover{background:rgba(203,162,76,.1);border-color:var(--brass)}
  .msNote{background:rgba(203,162,76,.09);border:1px solid var(--brass-dim);border-radius:7px;padding:9px 13px;margin-bottom:13px;font-size:12.5px}
  .msNote b{color:var(--brass)}

  .facs{background:var(--console2);border:1px solid var(--line);border-radius:9px;padding:12px 14px;margin-top:14px}
  .facs .gt{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--brass-dim);margin-bottom:10px}
  .chip.know{background:rgba(122,162,196,.13);border-color:rgba(122,162,196,.4);color:#a8c6de}
  .subhead{color:var(--brass);font-size:11px;letter-spacing:.12em;text-transform:uppercase;margin:14px 0 7px;border-bottom:1px solid var(--line);padding-bottom:5px}
  .choice.adv-fiscal{border-left:3px solid var(--brass)}
  .choice.adv-martial{border-left:3px solid var(--rust)}
  .choice.adv-civil{border-left:3px solid var(--sage)}
  .choice.adv-faith{border-left:3px solid #8f7ab5}
  .choice.adv-works{border-left:3px solid var(--blue)}
  .choice.dyn-match{border-left:3px solid #b5849a}
  .choice.dyn-love{border-left:3px solid #c76b8a}
  .choice.dyn-role{border-left:3px solid var(--brass)}
  .choice.dyn-desig{border-left:3px solid var(--sage)}
  .person .trait{font-size:10px;color:#6f7a84;font-style:italic;margin-left:6px}
  .person .trait.sure{color:var(--brass-dim);font-style:normal;letter-spacing:.04em;text-transform:uppercase;font-size:9.5px}
  .person .office{font-size:9.5px;color:var(--sage);margin-left:6px;letter-spacing:.04em;text-transform:uppercase}
  .domgroup{margin-bottom:10px}
  .domhead{display:flex;justify-content:space-between;align-items:center;cursor:pointer;padding:5px 8px;border-radius:6px;background:rgba(255,255,255,.02);border:1px solid var(--line)}
  .domhead .dn{font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--brass)}
  .domhead .dc{font-size:10.5px;color:var(--dim)}
  .domgroup.shut .choices{display:none}
  .choice.dom-martial{border-left:3px solid var(--rust)}
  .choice.dom-fiscal{border-left:3px solid var(--brass)}
  .choice.dom-faith{border-left:3px solid #8f7ab5}
  .choice.dom-civil{border-left:3px solid var(--sage)}
  .choice.dom-crown{border-left:3px solid var(--blue)}
  .choice.isnew{box-shadow:inset 0 0 0 1px rgba(198,164,106,.5)}
  .newtag{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--brass);margin-left:7px}
  .provs{margin-top:11px}
  .prov{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:#c3ccd4;padding:3px 0;border-bottom:1px solid rgba(255,255,255,.04)}
  .prov small{color:var(--dim);font-size:10px}
  .prov .pvl{font-family:ui-monospace,Menlo,monospace;color:#a8c6de;flex:none;margin-left:8px}
  .prov.warn .pvl{color:var(--brass)}
  .prov.crit .pvl{color:var(--crisis)}
  .prov.gone{color:#6f7a84;font-style:italic;font-size:11px}
  .register{border:1px solid var(--line);border-radius:8px;padding:8px 11px;margin-bottom:6px}
  .regrow{display:flex;justify-content:space-between;font-size:12.5px;color:#b7c0c8;padding:2px 0}
  .regrow.tot{border-top:1px solid var(--line);margin-top:5px;padding-top:5px;color:var(--brass)}
  .regrow .rv{font-family:ui-monospace,Menlo,monospace;color:#a8c6de}
  .budgetbreak{font-size:11px;color:var(--dim);line-height:1.55;margin-top:6px;padding-top:6px;border-top:1px solid var(--line)}
  .budgetbreak b{color:#b7c0c8;font-weight:600}
  .kbox{display:flex;justify-content:space-between;align-items:baseline;margin-top:7px;padding-top:7px;border-top:1px solid var(--line)}
  .kbox .kk{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
  .kbox .kv{font-family:ui-monospace,Menlo,monospace;font-size:14px;color:#a8c6de}
  .fac{display:block;margin-bottom:10px}
  .fac .frow{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
  .fac .fn{font-size:12px;color:#c3ccd4}
  .fac .fn small{color:var(--dim);font-size:10.5px}
  .fac .ft{display:block;width:100%;height:8px;background:#0c1218;border-radius:4px;overflow:hidden;border:1px solid #0a0f14}
  .fac .ft i{display:block;height:100%;border-radius:4px;transition:width .5s cubic-bezier(.4,0,.2,1),background .4s}
  .fac .fm{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.03em}
  .fac .fd{font-family:ui-monospace,Menlo,monospace;font-size:10.5px;margin-left:5px}
  .fac .fd.up{color:var(--good)} .fac .fd.dn{color:var(--crisis)}
  .fac.dormant{opacity:.35}

  .chron{background:var(--paper);overflow:hidden;box-shadow:-14px 0 46px rgba(0,0,0,.5);border:1px solid var(--paper-line);
    position:fixed;top:0;right:0;height:100vh;width:min(440px,94vw);z-index:31;border-radius:0;
    transform:translateX(105%);transition:transform .25s ease;display:flex;flex-direction:column}
  .chron.open{transform:none}
  .drawerbg{position:fixed;inset:0;background:rgba(6,10,14,.55);opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
  .drawerbg.open{opacity:1;pointer-events:auto}
  .chronclose{position:absolute;top:10px;right:12px;background:transparent;border:1px solid var(--paper-line);color:var(--paper-dim);border-radius:6px;padding:4px 10px;font-size:12px}
  .chron .ch-head{padding:15px 20px 11px;border-bottom:1px solid var(--paper-line);background:linear-gradient(180deg,#efe6d0,var(--paper))}
  .chron .ch-title{display:block;font-family:Georgia,serif;font-size:16px;color:var(--paper-ink);font-weight:600}
  .chron .ch-sub{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--paper-dim);margin-top:3px}

<script>
"use strict";
/* =====================================================================
   SOVEREIGN v3 — Dynastic-era foundation build
   Phased turns (Event? -> Court -> Dynastic?) · full family model
   (children, siblings, ages, era-scaled mortality, regency, rivals)
   · succession law (set at founding, reformable) · succession crises
   with player-chosen candidates that can BREAK the House
   · harsh economy · v2 bug fixes (gendered titles, event recurrence,
   tax-consent, crisis dedup). Standalone & offline.
   ===================================================================== */
const clamp=n=>Math.max(0,Math.min(100,Math.round(n)));
const rand=n=>Math.floor(Math.random()*n);
const pick=a=>a[rand(a.length)];
const chance=p=>Math.random()<p;

/* ---------- names, gender, titles, culture packs ----------
   A culture pack is pure window dressing: given names (split into an early
   and a later stratum so naming fashions drift as the ages turn), house
   names, family names, the crown's title forms, and suggestions when a
   chamber is chartered. The institutions underneath are unchanged — this
   is what the realm CALLS things.
   To add your own: copy any entry below and change the lists.            */
const CULTURES={
  anglo:{ name:"Anglo-Saxon", blurb:"Old English and Frankish-Germanic — the realm as it has always been named here.",
    m:{early:["Aldric","Theodane","Corvin","Lothair","Emeric","Baldwin","Roderic","Anselm","Godric","Osric","Wulfric","Eadric","Cenric","Aelfric","Beorn","Hereward"],

    f:{early:["Aliénor","Blanche","Adélaïde","Mahaut","Isabeau","Sibylle","Constance","Yolande","Agnès"],

    m:{early:["Alexios","Konstantinos","Nikephoros","Leontios","Basileios","Andronikos","Theodoros","Isaakios","Michael","Romanos"],
       late:["Georgios","Demetrios","Pavlos","Stephanos","Athanasios","Ioannis"]},
    f:{early:["Theodora","Anna","Eirene","Zoe","Euphrosyne","Helena","Pulcheria","Anastasia"],
       late:["Sophia","Alexandra","Kalliope","Despina","Olympia","Photini"]},
    surnames:["Komnenos","Doukas","Laskaris","Bryennios","Kantakouzenos","Palaiologos","Tornikios"],
    houses:["Komnenos","Doukas","Palaiologos","Laskaris","Angelos","Bryennios","Phokas"],
    titles:["Basileus","Emperor","King","Despot"],
    inst:["The Senate","The Synkletos","The Imperial Council","The Assembly of the City"] },
  nordic:{ name:"Nordic", blurb:"Northern crowns — things, jarls, and kings who must be acclaimed as well as born.",
    m:{early:["Halvard","Sigurd","Ragnvald","Eirik","Harald","Torgny","Ivar","Knut","Bjorn","Gunnar","Sverre"],
       late:["Gustav","Christian","Oskar","Magnus","Frederik","Carl"]},
    f:{early:["Astrid","Gudrun","Ingrid","Sigrid","Thyra","Ragnhild","Solveig","Hallveig","Bergljot"],
       late:["Margrethe","Kristina","Ulrika","Ingeborg","Dagmar","Sofia"]},
    surnames:["Bergstrand","Haugen","Nordahl","Skarsholm","Vinterberg","Aslaksen","Lindqvist"],
    houses:["Ynglinga","Sverkerholm","Bjarnason","Haakonar","Nordheim","Vasborg","Steinhall"],
    titles:["King","High King","Jarl","Emperor"],
    inst:["The Thing","The Council of Jarls","The Great Thing","The Assembly of Freemen"] },
  indian:{ name:"Indian", blurb:"Subcontinental crowns — dynasties measured in centuries and courts in scholars.",
    m:{early:["Harsha","Vikrama","Devapala","Rajendra","Chandran","Bhoja","Samudra","Narasimha","Pratap","Govinda"],
       late:["Ranjit","Arjun","Mahendra","Bahadur","Jaswant","Vijay","Devraj"]},
    f:{early:["Prabhavati","Rajyashri","Devika","Ratnavali","Indumati","Chandralekha","Kumaradevi","Lakshmi"],
       late:["Padmavati","Rukmini","Sharada","Meenakshi","Vasundhara","Anjali"]},
    surnames:["Chauhan","Rathore","Sisodia","Tomar","Parmar","Solanki","Bhonsle"],
    houses:["Chauhan","Rathore","Sisodia","Chalukya","Pallava","Kakatiya","Sena"],
    titles:["Raja","Maharaja","Samrat","Emperor"],
    inst:["The Sabha","The Royal Council","The Great Assembly","The Council of Ministers"] }
};
const CULTURE_KEYS=Object.keys(CULTURES);
function culture(St){ return CULTURES[(St&&St.culture)||"anglo"]||CULTURES.anglo; }
/* naming fashions drift: the later stratum appears once the realm has moved
   past its third age, then increasingly crowds out the older names */
function namePool(St,g){
  const c=culture(St), set=(g==="f")?c.f:c.m;
  const ei=(St&&typeof eraIdx==="function")?eraIdx(St):0;
  if(ei<3) return set.early;
  if(ei<4) return set.early.concat(set.late);
  return set.late.concat(set.early.slice(0,Math.max(3,set.early.length-6)));
}
function curS(){ return (typeof S!=="undefined")?S:null; }
function nameFor(g,used){
  const all=namePool(curS(),g);
  const pool=all.filter(n=>!used.has(n));
  return pool.length?pick(pool):pick(all);
}
function surnamePool(){ return culture(curS()).surnames; }
function housePool(){ return culture(curS()).houses; }
const TITLE_FORMS={
  "King":{m:"King",f:"Queen"}, "Emperor":{m:"Emperor",f:"Empress"},
  "High Prince":{m:"High Prince",f:"High Princess"}, "Grand Duke":{m:"Grand Duke",f:"Grand Duchess"},
  "Prince":{m:"Prince",f:"Princess"}, "Basileus":{m:"Basileus",f:"Basilissa"},
  "Despot":{m:"Despot",f:"Despoina"}, "High King":{m:"High King",f:"High Queen"},
  "Jarl":{m:"Jarl",f:"Jarla"}, "Raja":{m:"Raja",f:"Rani"},
  "Maharaja":{m:"Maharaja",f:"Maharani"}, "Samrat":{m:"Samrat",f:"Samragni"}
};
function titleFor(S,g){ const t=TITLE_FORMS[S.gov.crown.titleBase]||TITLE_FORMS["King"]; return g==="f"?t.f:t.m; }
function usedNames(S){ const u=new Set(); (S.lineage||[]).forEach(m=>u.add(m.name)); (S.family||[]).forEach(p=>u.add(p.name)); if(S.monarch)u.add(S.monarch.name); return u; }
const ROMAN=["","I","II","III","IV","V","VI","VII","VIII","IX","X","XI","XII","XIII","XIV"];
function regnalFor(S,name,house){ let n=1; (S.lineage||[]).forEach(m=>{ if(m.name===name)n++; }); return n; }
function styled(S,m){ return `${titleFor(S,m.gender)} ${m.name}${m.regnal>1?" "+(ROMAN[m.regnal]||m.regnal):""}`; }

/* ---------- succession law ---------- */
const LAWS={
  agnatic:{name:"Agnatic",desc:"Sons only inherit. Daughters and their lines are passed over entirely."},
  malepref:{name:"Male-preference",desc:"Sons first, by age; daughters inherit only if there are no sons."},
  absolute:{name:"Absolute",desc:"The eldest child inherits, son or daughter alike."},
  elective:{name:"Elective",desc:"The great houses (or the chamber, if one holds power) choose the successor."},
};
/* heirOf, kinDistance and designatable now live in 03a-family.js */

/* ---------- factions ---------- */
function newFactions(){
  return {
    aristocracy:{name:"Aristocracy",strength:80,mood:56,present:true},
    clergy:{name:"Clergy",strength:70,mood:58,present:true},
    officers:{name:"Officer Corps",strength:52,mood:54,present:true},
    merchants:{name:"Merchants",strength:34,mood:52,present:true},
    peasantry:{name:"Peasantry",strength:66,mood:50,present:true},
    provinces:{name:"Provinces",strength:50,mood:52,present:true},
    workers:{name:"Urban Workers",strength:0,mood:50,present:false},
    reformers:{name:"Reformers",strength:0,mood:50,present:false},
  };
}
const composition={ nobility:["aristocracy","clergy"], commons:["merchants","peasantry"], broad:["merchants","peasantry","provinces"] };
function compMood(S,comp){ const ks=composition[comp]||["aristocracy"]; let s=0; ks.forEach(k=>s+=S.facs[k].mood); return s/ks.length; }

/* ---------- power & consent ---------- */
function rightsHeld(S){ const r=new Set(); S.gov.institutions.forEach(i=>i.rights.forEach(x=>r.add(x))); return r; }
function institutionWithRight(S,right){ return S.gov.institutions.find(i=>i.rights.includes(right)); }
function consentCheck(S,right){
  const inst=institutionWithRight(S,right); if(!inst) return {required:false,approve:true};
  const mood=compMood(S,inst.composition);
  const threshold=48+inst.power*0.3;
  return {required:true,inst,approve:mood>=threshold,mood,threshold};
}
function transferPower(S,inst,amount){ const a=Math.min(amount,S.gov.crown.power); S.gov.crown.power-=a; inst.power+=a; }
function powerToCrown(S,inst,amount){ const a=Math.min(amount,inst.power); inst.power-=a; S.gov.crown.power+=a; }
function crownBand(S){
  const p=S.gov.crown.power;
  if(p>=60)return{label:"dominant",desc:"the Crown sets policy at will"};
  if(p>=40)return{label:"strong",desc:"assent is still required, and a royal veto is within reach"};
  if(p>=21)return{label:"constrained",desc:"ceremony, influence, and little else"};
  return{label:"a figurehead",desc:"the Crown reigns; it does not rule"};
}
const BLOC_MODS={
  aristocracy:{privileges:0.5,trade:1.3},
  clergy:{patronize:0.5},
  merchants:{trade:0.6,privileges:1.5},
  peasantry:{festival:0.7,privileges:0},
  provinces:{tour:0.6},
  officers:{fund_army:0.7},
};
const BLOC_DESCS={
  aristocracy:"privileges come cheap; trade projects cost more",
  clergy:"church patronage comes at half its price",
  merchants:"trade and works come cheap; noble privileges cost dear",
  peasantry:"festivals and relief come cheap; noble privileges are off the table",
  provinces:"royal tours come cheap",
  officers:"the army is funded gladly",
};
function costMod(S,id){
  let m=1;
  if(S._costMod)m*=S._costMod;
  if(S.monarch&&S.monarch.trait==="shrewd")m*=0.9;
  if(S.gov.cabinet)m*=0.9;
  if(id==="privileges"&&S.gov.institutions.some(i=>i.composition!=="nobility"))m*=1.4; // a lower chamber watches
  if(S.regency)m*=(S.regency.hostile?1.7:1.5);
  if(S.pm&&S.pm.bloc&&BLOC_MODS[S.pm.bloc]&&BLOC_MODS[S.pm.bloc][id]!=null){
    const b=BLOC_MODS[S.pm.bloc][id]; if(b===0)return 0; m*=b;
  }
  return m;
}
function adjCost(S,a){
  const c=Object.assign({},a.cost||{});
  const m=costMod(S,a.id);
  if(c.gold&&c.gold<0)c.gold=Math.round(c.gold*m);
  return c;
}
function maybeTransform(S){
  if(!S.pm&&!S._pmPending&&S.gov.institutions.length&&S.gov.crown.power<50) S._pmPending=true;
}
function runElection(){
  const set=new Set(); S.gov.institutions.forEach(i=>(composition[i.composition]||[]).forEach(k=>set.add(k)));
  if(!set.size)set.add("aristocracy");
  const standings=[...set].map(k=>({k,name:S.facs[k].name,score:Math.round(S.facs[k].mood*0.6+S.facs[k].strength*0.4+rand(18))}));
  standings.sort((a,b)=>b.score-a.score);
  return {standings,winner:standings[0].k};
}
function regimeLabel(S){
  const cp=S.gov.institutions.reduce((a,i)=>a+i.power,0);
  if(S.gov.crown.selection!=="hereditary") return "Republic";
  if(S.gov.charter) return cp>=45?"Parliamentary Monarchy":"Constitutional Monarchy";
  if(cp<12) return "Absolute Monarchy";
  if(cp<40) return "Constitutional Monarchy";
  return "Parliamentary Monarchy";
}
function legitimacy(S){
  const clergy=S.facs.clergy.mood, aristo=S.facs.aristocracy.mood;
  const succ=(S.law==="elective")?58:(heirOf(S)?76:34);
  let v=0.30*clergy+0.24*aristo+0.34*succ+(S.gov.charter?6:0)+(S.facs.peasantry.mood-50)*0.12;
  if(S.regency) v-=10;
  v-=(S.legitPen||0);
  return clamp(v);
}
function legitSources(S){
  const bits=[];
  bits.push(S.facs.clergy.mood>=55?"divine favour":"the faith wavers");
  if(S.law==="elective") bits.push("an elective crown");
  else bits.push(heirOf(S)?"a clear succession":"no clear heir");
  if(S.regency) bits.push("a regency governs");
  return bits.join(" · ");
}

/* ---------- economy (harsher) ---------- */
const TAX_TIERS={
  none:{label:"None",mult:0.2,stab:+2,fac:{peasantry:+4,merchants:+3}},
  light:{label:"Light",mult:0.65,stab:+1,fac:{peasantry:+2}},
  moderate:{label:"Moderate",mult:1.0,stab:0,fac:{peasantry:-1}},
  heavy:{label:"Heavy",mult:1.4,stab:-2,fac:{peasantry:-4,merchants:-3}},
  oppressive:{label:"Oppressive",mult:1.8,stab:-5,fac:{peasantry:-8,merchants:-5,provinces:-4}},
};
const TAX_ORDER=["none","light","moderate","heavy","oppressive"];
function income(S){
  /* crown lands sold in a capitulation are gone for good — the ceiling drops */
  const base=(16+S.development*0.55)*(1+(S._taxBonus||0))*(1-(S._landsSold||0));
  return Math.round(base*TAX_TIERS[S.taxRate].mult)+(S._companyGold||0); }
function upkeep(S){
  let u=10+Math.round(S.military*0.4)+S.privileges*4;
  u+=Math.round(S.family.filter(p=>p.alive).length*1.2); // the court eats
  if(S.gov.cabinet)u+=5;
  u+=(S._armyUpkeep||0);
  if(S.debt>0)u+=Math.min(30,Math.round(S.debt*0.12));
  return u;
}
function netIncome(S){ return income(S)-upkeep(S); }
const OVERDRAFT=40;

/* how the money is actually figured — shown in the sidebar so the arithmetic
   is never a mystery */
/* ---------- rupture pressure ----------
   Each rupture builds visible weather before it breaks. These return a
   pressure in years, so a rupture is always something you were warned of. */
function debtPressure(S){ return S._debtYears||0; }
function reactionPressure(S){ return S._reactYears||0; }
function pliableKin(S){
  return (S.family||[]).filter(p=>p.alive&&p.age>=14&&!p.outHouse&&p.house===S.house
      &&["child","sibling","nephew","uncle","grandchild","kin"].includes(p.rel))
    .sort((a,b)=>(a.trait==="cruel"?1:0)-(b.trait==="cruel"?1:0)||b.age-a.age)[0]||null;
}
function budgetBreakdown(S){
  const dev=Math.round(S.development*0.55);
  const tax=TAX_TIERS[S.taxRate];
  const comp=S._companyGold||0;
  const parts=[];
  parts.push(`<b>In:</b> 16 base + ${dev} from development${(S._taxBonus?` +${Math.round((S._taxBonus)*100)}% (census)`:"")}, all ×${tax.mult} (${tax.label.toLowerCase()})${comp?` , +${comp} from the Company (untaxed)`:""}`);
  const up=[];
  up.push("10 court");
  up.push(`${Math.round(S.military*0.4)} arms`);
  if(S.privileges)up.push(`${S.privileges*4} privileges`);
  const kin=(S.family||[]).filter(p=>p.alive).length;
  if(kin)up.push(`${Math.round(kin*1.2)} royal household`);
  if(S.gov.cabinet)up.push("5 cabinet");
  if(S._armyUpkeep)up.push(`${S._armyUpkeep} standing army`);
  if(S.debt>0)up.push(`${Math.min(30,Math.round(S.debt*0.12))} debt service`);
  parts.push(`<b>Out:</b> ${up.join(" + ")}`);
  if(S._landsSold)parts.push(`<b>Crown lands sold in the capitulation:</b> receipts permanently reduced by ${Math.round(S._landsSold*100)}%`);
  parts.push(`<b>A turn is 3–5 years</b>; the net above is what the treasury takes in a turn of ordinary length.`);
  return parts.join("<br>");
}
/* ---------- mortality (era-scaled; Dynastic is dangerous) ---------- */
function mortalityChance(age,years){
  // per span of `years`; Dynastic-era medicine
  let annual;
  if(age<10) annual=0.015; else if(age<30) annual=0.008; else if(age<45) annual=0.014;
  else if(age<55) annual=0.03; else if(age<65) annual=0.07; else if(age<75) annual=0.14; else annual=0.28;
  return 1-Math.pow(1-annual,years);
}

/* =====================================================================
   THE FAMILY GRAPH
   Relations are DERIVED, never stored. Each person keeps only facts that
   never change — who their parents are, who they married, which house
   they belong to. Everything else (son, aunt, nephew-by-marriage) is
   computed against whoever currently wears the crown, so no succession
   path can leave a stale or orphaned label behind.
   ===================================================================== */

function allPersons(S){
  const out=[]; if(S.monarch)out.push(S.monarch);
  (S.family||[]).forEach(p=>out.push(p));
  (S.ancestors||[]).forEach(p=>{ if(!out.some(q=>q.id===p.id))out.push(p); });
  return out;
}
function personAny(S,id){ return allPersons(S).find(p=>p.id===id)||null; }
function birthOrder(p){ return (p.born!=null)?p.born:(9999-(p.age||0)); }

/* every ancestor of a person, mapped to how many generations up they are */
function ancestryOf(S,id,depth){
  const seen=new Map(); const lim=depth||6;
  (function walk(pid,d){
    if(d>lim)return;
    /* record the id even when the person object is gone — a pruned or
       never-materialized ancestor must still serve as a join point, or
       whole branches of the family read as strangers */
    if(!seen.has(pid)||seen.get(pid)>d) seen.set(pid,d);
    const p=personAny(S,pid); if(!p)return;
    (p.parents||[]).forEach(par=>{ if(par)walk(par,d+1); });
  })(id,0);
  return seen;
}
/* {up,down} from ref to person through their nearest common ancestor */
function bloodRel(S,refId,pId){
  if(refId===pId) return {up:0,down:0};
  const A=ancestryOf(S,refId), B=ancestryOf(S,pId);
  let best=null;
  A.forEach((up,aid)=>{ if(B.has(aid)){ const down=B.get(aid);
    if(!best||(up+down)<(best.up+best.down)||((up+down)===(best.up+best.down)&&up<best.up)) best={up,down}; } });
  return best;
}
function bloodCode(r){
  if(!r) return null;
  const {up,down}=r;
  if(up===0&&down===1) return "child";
  if(up===1&&down===0) return "parent";
  if(up===1&&down===1) return "sibling";
  if(up===0&&down===2) return "grandchild";
  if(up===2&&down===0) return "grandparent";
  if(up===2&&down===1) return "uncle";
  if(up===1&&down===2) return "nephew";
  if(up===0&&down>=3)  return "grandchild";
  if(up>=3&&down===0)  return "grandparent";
  return "kin";
}
/* the label code for one person, computed against the reigning sovereign */
function relCodeFor(S,p){
  const m=S.monarch; if(!m||p.id===m.id) return "self";
  if(p.outHouse) return "former";
  if(p.spouseId===m.id||m.spouseId===p.id) return (m.alive===false)?"dowager":"spouse";
  const b=bloodCode(bloodRel(S,m.id,p.id));
  if(b) return b;
  /* married in: take the meaning of whoever they married */
  if(p.spouseId){
    const sp=personAny(S,p.spouseId);
    if(sp){
      const sb=bloodCode(bloodRel(S,m.id,sp.id));
      if(sb==="child") return "childspouse";
      if(sb) return "inlaw";
    }
  }
  /* consort of a former sovereign */
  if((S.lineage||[]).some(l=>l.id===p.spouseId)) return "dowager";
  return "kin";
}
function refreshRelations(S){
  if(!S||!S.monarch)return;
  (S.family||[]).forEach(p=>{ p.rel=relCodeFor(S,p); });
}

/* ---------- succession: a proper walk of the tree, by law ---------- */
function lawFilter(S,list){
  if(S.law==="agnatic") return list.filter(p=>p.gender==="m");
  return list.slice();
}
function lawSort(S,list){
  const byBirth=(a,b)=>birthOrder(a)-birthOrder(b);
  if(S.law==="malepref"){
    const m=list.filter(p=>p.gender==="m").sort(byBirth);
    const f=list.filter(p=>p.gender!=="m").sort(byBirth);
    return m.concat(f);
  }
  return list.slice().sort(byBirth);
}
function childrenOf(S,id){
  return allPersons(S).filter(p=>p.parents&&p.parents.includes(id)&&p.id!==id);
}
/* a person's line: themselves if living, then their issue by representation */
function lineFrom(S,id,out,depth){
  out=out||[]; depth=depth||0; if(depth>5)return out;
  const kids=lawSort(S,lawFilter(S,childrenOf(S,id)));
  kids.forEach(k=>{
    if(k.alive&&!k.exiled&&!k.outHouse) out.push(k);
    lineFrom(S,k.id,out,depth+1);
  });
  return out;
}
function successionLine(S){
  if(!S.monarch) return [];
  const line=lineFrom(S,S.monarch.id);
  if(line.length) return line;
  /* the direct line is bare — climb to the parents, then the grandparents,
     taking each generation's other branches in order */
  let node=S.monarch, guard=0;
  while(guard++<4){
    const parents=(node.parents||[]).map(id=>personAny(S,id)).filter(Boolean);
    if(!parents.length) break;
    for(const par of parents){
      const branch=lineFrom(S,par.id).filter(p=>p.id!==S.monarch.id&&p.id!==node.id);
      if(branch.length) return branch;
    }
    node=parents[0];
  }
  /* nothing by descent — fall back to any living sibling recorded flat */
  return lawSort(S,lawFilter(S,(S.family||[]).filter(p=>p.alive&&p.rel==="sibling")));
}
function heirOf(S){
  if(S.law==="elective") return null;
  if(S.designated){ const d=(S.family||[]).find(p=>p.id===S.designated&&p.alive); if(d) return d; }
  return successionLine(S)[0]||null;
}
/* how far from the lawful line someone sits — drives the cost of passing over */
function kinDistance(S,p){
  const r=bloodRel(S,S.monarch.id,p.id);
  if(!r) return 5;
  const d=r.up+r.down;
  return Math.min(5,Math.max(0,d-1));
}
function designatable(S){
  return (S.family||[]).filter(p=>p.alive&&p.age>=6&&!p.outHouse&&p.rel!=="spouse"&&p.rel!=="dowager"&&p.rel!=="childspouse"&&p.rel!=="inlaw")
    .sort((a,b)=>kinDistance(S,a)-kinDistance(S,b)||birthOrder(a)-birthOrder(b)).slice(0,10);
}

/* =====================================================================
   THE PROVINCES
   A light territorial model — no map, no borders, just named places with
   loyalty of their own. The provinces ESTATE remains the countryside's
   voice at court; this is the country itself. Provinces can drift, be
   governed by a royal, and — if neglected long enough — leave.
   ===================================================================== */
const PROV_PARTS={
  pre:["North","South","East","West","Upper","Lower","Old","Far","Inner","Outer"],
  root:["march","vale","reach","moor","fen","weald","holt","strand","hollow","dale","wold","heath"],
  seat:["Aldmoor","Carrow","Brenna","Halstead","Verrin","Dunmere","Kessley","Tarnwick","Ostry","Cawdale","Merrow","Lindholt","Rask","Ferrow"]
};
function newProvinces(S,n){
  const out=[], usedSeat=new Set(), usedName=new Set();
  const count=n||(4+rand(3));
  for(let i=0;i<count;i++){
    let name, guard=0;
    const cap=w=>w.charAt(0).toUpperCase()+w.slice(1);
    do{ name = chance(0.5)
      ? `${pick(PROV_PARTS.pre)} ${cap(pick(PROV_PARTS.root))}`
      : `The ${cap(pick(PROV_PARTS.root))} of ${pick(PROV_PARTS.seat)}`;
    }while(usedName.has(name)&&guard++<20);
    usedName.add(name);
    let seat; guard=0;
    do{ seat=pick(PROV_PARTS.seat); }while(usedSeat.has(seat)&&guard++<20);
    usedSeat.add(seat);
    out.push({ id:"p"+i, name, seat,
      loyalty: 52+rand(16),
      weight: 1,                 /* share of the realm this province is */
      governor: null,            /* a royal id, if one has been sent */
      core: i===0,               /* the heartland never secedes */
      unrest: 0 });
  }
  out[0].name = "The Crownlands";
  out[0].weight = 1.4;
  return out;
}
function provinces(S){ return S.provinces||[]; }
function provinceById(S,id){ return provinces(S).find(p=>p.id===id)||null; }
function provinceOfGovernor(S,personId){ return provinces(S).find(p=>p.governor===personId)||null; }
function provinceLoyaltyAvg(S){
  const ps=provinces(S); if(!ps.length)return 50;
  const tw=ps.reduce((a,p)=>a+p.weight,0);
  return ps.reduce((a,p)=>a+p.loyalty*p.weight,0)/tw;
}
/* provinces drift toward the mood of the provinces estate, with local noise;
   a resident royal governor holds a province steady */
function tickProvinces(S,span){
  const target=S.facs.provinces.mood;
  provinces(S).forEach(p=>{
    const gov=p.governor?(S.family||[]).find(x=>x.id===p.governor&&x.alive):null;
    if(p.governor&&!gov) p.governor=null;
    /* a resident royal blunts the pull of a sour court and lifts the province */
    let pull=(target-p.loyalty)*(gov?0.19:0.28);
    if(gov) pull+=6;
    if(p.core) pull+=1.5;
    if(S.stability<40) pull-=2;
    p.loyalty=clamp(p.loyalty+pull+(rand(5)-2));
    p.unrest = p.loyalty<30 ? (p.unrest||0)+span : 0;
  });
}
function restiveProvinces(S){ return provinces(S).filter(p=>!p.core&&p.loyalty<32); }
function secedingProvince(S){
  /* a province that has been at rock bottom for a decade is ready to go */
  return provinces(S).filter(p=>!p.core&&p.loyalty<24&&(p.unrest||0)>=10)
    .sort((a,b)=>a.loyalty-b.loyalty)[0]||null;
}
function loseProvince(S,p){
  S.provinces=provinces(S).filter(x=>x.id!==p.id);
  S.lostProvinces=S.lostProvinces||[];
  S.lostProvinces.push({name:p.name,seat:p.seat,year:S.year});
  S.development=clamp(S.development-Math.round(7*p.weight));
  S.facs.provinces.strength=clamp(S.facs.provinces.strength-6);
  S._realmShrunk=(S._realmShrunk||0)+1;
}
function provinceLabel(l){
  if(l>=70)return "devoted"; if(l>=56)return "content"; if(l>=44)return "quiet";
  if(l>=32)return "restive"; if(l>=24)return "seething"; return "in open defiance";
}

function actView(S,a){
  const map=ACT_EVO[a.id]; if(!map) return a;
  const ei=eraIdx(S);
  let form=null;
  Object.keys(map).map(Number).sort((x,y)=>x-y).forEach(k=>{ if(ei>=k) form=map[k]; });
  return form?Object.assign({},a,form):a;
}
function availableActions(S){ return ACTIONS.filter(a=>a.requires(S)&&!onCooldown(S,a.id)&&costMod(S,a.id)!==0); }
function onCooldown(S,id){ return (S.cooldowns[id]||0)>S.turn; }
function affordable(S,a){ const g=(adjCost(S,a).gold)||0; if(g>=0)return true; return (S.treasury+g)>=-OVERDRAFT; }

function availableReforms(S){ if(S.regency)return []; return REFORMS.filter(r=>r.available(S)); }
function cloneState(S){ const c=JSON.parse(JSON.stringify(S,(k,v)=>typeof v==="function"?undefined:v)); c.currentEvent=null; c.dyn=null; c.pending=null; c.result=null; return c; }
function previewReform(S,r,power,lawChoice){
  const before=new Set(availableActions(S).map(a=>a.label));
  const clone=cloneState(S);
  r.enact(clone,power||r.pdef, r.lawPick?(lawChoice||"absolute"):(r.nameSuggest[0]||"X"));
  const after=new Set(availableActions(clone).map(a=>a.label));
  const unlocks=[...after].filter(x=>!before.has(x));
  const locks=[...before].filter(x=>!after.has(x));
  const fac=[]; for(const k in S.facs){ const d=clone.facs[k].mood-S.facs[k].mood; if(d)fac.push({k,d,name:S.facs[k].name}); }
  const rBefore=rightsHeld(S),rAfter=rightsHeld(clone); const newRights=[...rAfter].filter(x=>!rBefore.has(x)&&x!=="petition");
  let heirNote=null;
  if(r.lawPick){ const h1=heirOf(S),h2=heirOf(clone);
    heirNote=(h2?("Heir would be: "+h2.name):(lawChoice==="elective"?"The houses would choose each successor.":"No eligible heir under this law."))+(h1&&h2&&h1.id!==h2.id?" (changed)":""); }
  return {unlocks,locks,fac,newRights,power:power||r.pdef,heirNote};
}

    text:S=>`Rain when there should have been sun, and then none at all. The granaries will not fill this year, and the price of bread has already told everyone what that means before the survey has even been read.`,
    choices:[
      {label:"Buy grain abroad at whatever it costs",cost:{gold:-30,stability:+4},fac:{peasantry:+8,merchants:+3},
        chron:S=>`a failed harvest was met by grain bought abroad at ruinous cost.`,
        out:"Ships and wagons and a bill that will be felt for years. Nobody starves, which is the whole point."},
      {label:"Fix the price of bread by decree",cost:{stability:-4},fac:{peasantry:+6,merchants:-11},
        chron:S=>`the Crown fixed the price of bread against a failed harvest; the merchants took the loss and remembered it.`,
        out:"Bread stays affordable and the grain factors are furious. Some of it quietly leaves the country instead."},
      {label:"Let the market find its level",cost:{stability:-12},fac:{peasantry:-15,merchants:+7,provinces:-6},
        chron:S=>`the Crown let bread find its own price through a hungry winter.`,
        out:"The price triples. The factors do very well. There is a word for what happens in the towns by spring, and it is not 'discontent'."}]},
  { id:"pestilence",w:0.9,freq:7,title:"Pestilence",
    text:S=>`It arrives the way it always does — a port, a rumour, then a street where nobody answers the door. The physicians disagree about everything except that it is spreading.`,
    choices:[
      {label:"Quarantine the ports and the afflicted towns",cost:{gold:-20,stability:-5},fac:{merchants:-9,clergy:+4},
        effect:S=>{S._plagueMild=true;},
        chron:S=>`pestilence came to ${S.nation} and was met with quarantine; trade suffered and the death rolls stayed short.`,
        out:"Chains across the harbour and cordons around three towns. Trade strangles for a year. Far fewer graves than there might have been."},
      {label:"Trust to prayer and processions",cost:{stability:-9},fac:{clergy:+9,peasantry:-6},
        effect:S=>{S.development=clamp(S.development-7);S.family.forEach(p=>{if(p.alive&&chance(0.12)){p.alive=false;p.diedTurn=S.turn;S.notices.push({t:"d",id:p.id,name:p.name,age:p.age});}});},
        chron:S=>`pestilence swept the realm and was answered with processions; it took the poor, the rich, and some of the royal house.`,
        out:"The processions are magnificent and they gather the whole city into one place, which is exactly the difficulty. The rolls are long. The palace is not spared."},
      {label:"Pay the physicians and open the pest-houses",cost:{gold:-26},fac:{peasantry:+6,clergy:-5},
        effect:S=>{S.development=clamp(S.development-2);},
        chron:S=>`the Crown paid for physicians and pest-houses through the plague year.`,
        out:"Expensive, half-effective, and resented from the pulpits for meddling with providence. Fewer die than would have."}]},
  { id:"mutiny",w:1.1,freq:5,when:S=>eraIdx(S)>=2&&(S._armyUpkeep||0)>0,title:"The Regiments Are Unpaid",
    text:S=>`A standing army is a wonderful thing until the pay chest is late. Three regiments have not been paid in eleven months. They have not deserted — which, the officers explain carefully, is not the same as being reliable.`,
    choices:[
      {label:"Pay the arrears in full, at once",cost:{gold:-34,stability:+4},fac:{officers:+11},
        chron:S=>`the Crown found the money and paid the army's arrears in full.`,
        out:"The chests go out under guard and the mood turns within a week. Soldiers who are paid on time are a different animal entirely."},
      {label:"Pay half and promise the rest",cost:{gold:-16,stability:-5},fac:{officers:-6},
        chron:S=>`the Crown paid half the army's arrears and promised the remainder.`,
        out:"Half now buys you a year. The officers write it down. Everyone writes it down."},
      {label:"Let them plunder the country instead",cost:{stability:-16},fac:{officers:+5,peasantry:-16,provinces:-13},
        effect:S=>{S.development=clamp(S.development-5);},
        chron:S=>`unpaid regiments were turned loose upon the countryside in lieu of wages.`,
        out:"You solve an army problem by creating a country problem. The regiments are content. Four districts are not, and will not be for a long time."}]},
  { id:"siege_ledger",w:1.0,freq:6,when:S=>eraIdx(S)>=2&&ownsAdv(S,"bastion"),title:"The Fortress Ledger",
    text:S=>`The engineers present their accounts. The bastions are magnificent, unbreachable, and consuming more of the revenue than the entire civil government. They would like to discuss the next phase.`,
    choices:[
      {label:"Build on — the realm must be unassailable",cost:{gold:-30},fac:{officers:+7,merchants:-7},
        effect:S=>{S.military=clamp(S.military+7);S._armyUpkeep=(S._armyUpkeep||0)+4;},
        chron:S=>`the Crown pressed on with the fortress programme whatever the cost.`,
        out:"Unassailable, and closer to insolvent every year. This is precisely how real crowns ended up begging their estates for money."},
      {label:"Halt the programme where it stands",cost:{stability:-5},fac:{officers:-9,merchants:+6},
        effect:S=>{S._armyUpkeep=Math.max(0,(S._armyUpkeep||0)-5);},
        chron:S=>`the Crown halted the fortress programme, half-finished, to save the treasury.`,
        out:"Half a ring of works and a saved treasury. The engineers are appalled; the bankers are relieved."}]},
  { id:"bank_run",w:1.0,freq:6,when:S=>eraIdx(S)>=3&&(S._creditBonus||0)>0,title:"The Banks Will Not Lend",
    text:S=>`A rumour, a refused bill, a queue outside a counting house at dawn. By the third day the credit of the realm is a question rather than an assumption, and the Crown's own paper is trading below its face.`,
    choices:[
      {label:"Guarantee the banks from the treasury",cost:{gold:-32,stability:+3},fac:{merchants:+11},
        chron:S=>`the Crown guaranteed the banks through the panic and the credit of ${S.nation} held.`,
        out:"You spend a fortune to stop a queue. It works, and nobody thanks you, because the disaster that didn't happen is invisible."},
      {label:"Let the weak houses fail",cost:{stability:-11},fac:{merchants:-14,peasantry:-5},
        effect:S=>{S._creditBonus=Math.max(0,(S._creditBonus||0)-50);S.development=clamp(S.development-4);},
        chron:S=>`the Crown let the banking houses fail; credit contracted and did not return for a generation.`,
        out:"Three houses go down and take a great deal of other people's money with them. Your own borrowing costs more from now on."}]},
  { id:"bread_riots",w:1.1,freq:5,when:S=>eraIdx(S)>=3&&(S.facs.peasantry.mood<45||S.facs.merchants.mood<40),title:"Bread Riots in the Capital",
    text:S=>`It starts at a bakery and by evening it is four streets. They are not asking for a chamber or a charter. They are asking for bread, which is a far harder demand to negotiate away.`,
    choices:[
      {label:"Send the troops in",cost:{stability:-8},fac:{peasantry:-16,officers:+4,merchants:+5},
        effect:S=>{S.legitPen=(S.legitPen||0)+6;},
        chron:S=>`bread riots in the capital were put down by musketry.`,
        out:"Order is restored by evening. There is a number attached to that, and the newspapers — or the pamphlets, or the balladeers — will make sure it is remembered."},
      {label:"Open the crown's own stores",cost:{gold:-24,stability:+5},fac:{peasantry:+11},
        chron:S=>`the Crown opened its own stores to the rioting poor, and the streets emptied peacefully.`,
        out:"Carts of grain instead of volleys. It costs a great deal and it buys something no volley ever has."},
      {label:"Hang the ringleaders and fix the price",cost:{stability:-3},fac:{peasantry:-6,merchants:-8},
        chron:S=>`the ringleaders were hanged and the price of bread fixed by proclamation.`,
        out:"Both barrels: a gallows and a price control. The streets clear. Nobody is happy, which is at least even-handed."}]},
  { id:"pamphlet_war",w:1.1,freq:4,when:S=>eraIdx(S)>=4||ownsAdv(S,"press"),title:"The Pamphlet War",
    text:S=>`Somebody with a press and no fear has begun printing about the court. It is funny, it is filthy, it is largely accurate, and it is being read aloud in every coffee house in the capital.`,
    choices:[
      {label:"Find the press and break it",cost:{gold:-8,stability:-6},fac:{clergy:+5,merchants:-8,reformers:-9},
        effect:S=>{S.legitPen=(S.legitPen||0)+5;},
        chron:S=>`the Crown hunted down the presses; the pamphlets multiplied in the hunting.`,
        out:"You break one press. Four more appear, and now the story is about the breaking rather than the scandal."},
      {label:"Answer it — buy presses of your own",cost:{gold:-18},fac:{merchants:+4},
        effect:S=>{S._know.press=(S._know.press||0)+0.3;},
        chron:S=>`the Crown answered the pamphleteers in print rather than by arrest.`,
        out:"Undignified, effective, and quietly the beginning of something: the realm now has a government that argues in public."},
      {label:"Ignore it entirely",cost:{stability:-3},fac:{reformers:+4},
        chron:S=>`the Crown ignored the pamphleteers, and the pamphlets went on.`,
        out:"It burns for a season and moves on to somebody else. Some of what was printed sticks anyway."}]},
  { id:"salon_plot",w:0.9,freq:6,when:S=>eraIdx(S)>=4,title:"The Conspiracy of the Salons",
    text:S=>`It is not a plot exactly. It is a dozen well-born people who meet to discuss philosophy, and who have lately been discussing which philosophies a crown could survive. One of them has written it down.`,
    choices:[
      {label:"Arrest them",cost:{stability:-7},fac:{aristocracy:-9,reformers:-11,clergy:+6},
        effect:S=>{S.legitPen=(S.legitPen||0)+7;},
        chron:S=>`the salon philosophers were arrested, and became the most widely read men in the realm.`,
        out:"They go to prison, where they write. What they write travels further than their conversation ever did."},
      {label:"Invite them to court instead",cost:{gold:-14,stability:+4},fac:{aristocracy:+5,reformers:+9,clergy:-6},
        effect:S=>{S._advDiscount=(S._advDiscount||1)*0.96;},
        chron:S=>`the Crown brought the philosophers to court and made patronage of what might have been sedition.`,
        out:"Pensions, dinners and flattery. Two of them become sincere royalists. The rest at least write more carefully."},
      {label:"Have them watched and left alone",fac:{reformers:+3},
        chron:S=>`the Crown had the salons watched, and did nothing further.`,
        out:"A drawer fills with reports that nobody acts on. It is the cheapest option and it decides nothing."}]},
  { id:"great_fire",w:0.85,freq:8,title:"The Capital Burns",
    text:S=>`It began in a workshop and the wind was wrong. By the second night a quarter of the capital is gone and the river is full of people who saved nothing.`,
    choices:[
      {label:"Rebuild in stone at the crown's charge",cost:{gold:-36,stability:+6},fac:{merchants:+8,peasantry:+7,provinces:-3},
        effect:S=>{S.development=clamp(S.development+5);},
        chron:S=>`after the great fire the Crown rebuilt the capital in stone at its own charge.`,
        out:"A colossal bill and a better city — wider streets, stone frontages, and a reputation that outlives everyone involved."},
      {label:"Leave the rebuilding to those who own the ground",cost:{stability:-9},fac:{merchants:-6,peasantry:-9},
        effect:S=>{S.development=clamp(S.development-5);},
        chron:S=>`the burnt capital was left to rebuild itself, and did so badly.`,
        out:"It goes back up crooked, wooden and fast, which means it will burn again. The displaced are still displaced a decade later."}]},
  /* ================= RUPTURE: PROVINCIAL SECESSION ================= */
  { id:"prov_warning",w:1.4,freq:3,when:S=>restiveProvinces(S).length>0,
    title:S=>`Trouble in ${restiveProvinces(S)[0].name}`,
    text:S=>{const p=restiveProvinces(S)[0];
      return `The assizes at ${p.seat} returned empty again. The crown's writ is read aloud in ${p.name} and then, politely, ignored; the tax farmers travel with escorts or not at all. Loyalty there stands at ${Math.round(p.loyalty)}, and the word being used in the market is not 'grievance'.`;},
    choices:[
      {label:"Send a royal to govern them in person",cost:{gold:-16},fac:{provinces:+6},
        effect:S=>{const p=restiveProvinces(S)[0]; if(!p)return;
          const cand=(S.family||[]).filter(x=>x.alive&&x.age>=16&&!x.job&&!x.outHouse)[0];
          if(cand){cand.job="governor";p.governor=cand.id;p.loyalty=clamp(p.loyalty+14);}
          else p.loyalty=clamp(p.loyalty+7);},
        chron:S=>`the Crown sent one of its own blood to govern a restive province.`,
        out:"A royal household established where there had only been a tax collector. It is remarkable how much difference being visited makes."},
      {label:"Remit their dues for a term",cost:{gold:-22},fac:{provinces:+8,merchants:-4},
        effect:S=>{const p=restiveProvinces(S)[0]; if(p)p.loyalty=clamp(p.loyalty+16);},
        chron:S=>`the Crown remitted the dues of a restive province to buy back its loyalty.`,
        out:"You forgive the arrears and the resentment goes with them. Expensive, and it teaches a lesson somebody else will try to learn from."},
      {label:"Garrison the province and collect by force",cost:{gold:-12,arms:-3},fac:{provinces:-9,officers:+3},
        effect:S=>{const p=restiveProvinces(S)[0]; if(p)p.loyalty=clamp(p.loyalty-6);},
        chron:S=>`the Crown answered provincial discontent with a garrison and a tax column.`,
        out:"The money comes in. So does the reason they wanted to stop paying in the first place."},
      {label:"Ignore it — the country always grumbles",cost:{stability:-3},fac:{provinces:-6},
        effect:S=>{const p=restiveProvinces(S)[0]; if(p)p.loyalty=clamp(p.loyalty-8);},
        chron:S=>`the Crown ignored the discontent of a distant province.`,
        out:"Nothing happens this year. Something is quite clearly going to happen in another one."}]},
  { id:"secession",w:9,freq:1,when:S=>!!secedingProvince(S),
    title:S=>`${secedingProvince(S).name} Renounces the Crown`,
    text:S=>{const p=secedingProvince(S);
      return `It is done in daylight and with paperwork. The estates of ${p.name} met at ${p.seat}, read a declaration that had clearly been drafted some time ago, and struck the crown's arms from the courthouse door. There is no army marching. There is simply a part of the realm that has stopped being part of the realm.`;},
    choices:[
      {label:"March, and bring them back by force",
        resolve:S=>{ const p=secedingProvince(S);
          if(S.military>=52&&S.facs.officers.mood>=48){
            return {cost:{arms:-12,gold:-26,stability:-8},fac:{provinces:-10,officers:+4},
              effect:S2=>{const q=secedingProvince(S2); if(q){q.loyalty=clamp(q.loyalty+22);q.unrest=0;}},
              chron:S2=>`${p.name} renounced the Crown and was brought back into the realm at the point of the sword.`,
              out:`The columns go in and the declaration is burned in the square at ${p.seat}. ${p.name} is yours again — sullen, garrisoned, and expensive to keep. You have bought perhaps a generation.`,fortune:"good"};}
          return {cost:{arms:-16,gold:-30,stability:-14},fac:{provinces:-12,officers:-8},
            effect:S2=>{const q=secedingProvince(S2); if(q)loseProvince(S2,q); S2.legitPen=(S2.legitPen||0)+10;},
            chron:S2=>`the Crown marched against seceding ${p.name} and was beaten; the province was lost, and the losing was public.`,
            out:`The army goes in and does not come back out with the province. ${p.name} is gone, and now everyone has watched the crown fail at something it announced it would do. That is the more expensive loss.`,fortune:"bad"};}},
      {label:"Let them go, and salvage what terms you can",cost:{stability:-9},fac:{provinces:-5,merchants:+3},
        effect:S=>{const p=secedingProvince(S); if(p)loseProvince(S,p); S.legitPen=(S.legitPen||0)+5;},
        chron:S=>`the Crown let a seceding province depart, taking terms rather than casualties.`,
        out:"Envoys, a treaty of commerce, a face-saving phrase about ancient friendship. The realm is permanently smaller and permanently poorer — and it did not have to bury anyone to find that out."}]},
  /* ================= RUPTURE: BANKRUPTCY CAPITULATION ================= */
  { id:"debt_warning",w:1.5,freq:2,when:S=>debtPressure(S)>=4&&debtPressure(S)<14,
    title:"The Bankers Ask for a Private Word",
    text:S=>`They are unfailingly polite about it. The interest is being serviced with borrowing; the borrowing is being serviced with more borrowing; and the gentlemen of the exchange would like to know — privately, before anyone else asks publicly — what the Crown intends to do about it.`,
    choices:[
      {label:"Retrench — cut the household and the establishment",cost:{gold:+22,stability:-6},fac:{aristocracy:-8,officers:-6},
        effect:S=>{S._debtYears=Math.max(0,(S._debtYears||0)-8);S._armyUpkeep=Math.max(0,(S._armyUpkeep||0)-3);},
        chron:S=>`the Crown retrenched sharply to hold off its creditors.`,
        out:"Pensions stopped, offices left vacant, regiments quietly under strength. Ugly, unpopular, and it buys you years."},
      {label:"Sell offices and honours for ready money",cost:{gold:+30},fac:{aristocracy:+4,merchants:-6},
        effect:S=>{S._debtYears=Math.max(0,(S._debtYears||0)-5);S._costMod=(S._costMod||1)*1.06;},
        chron:S=>`the Crown sold offices and honours to stave off its creditors.`,
        out:"Money now, government by the highest bidder later. Every office you sell is one you cannot use."},
      {label:"Borrow again and say nothing",cost:{stability:-3},
        effect:S=>{S._debtYears=(S._debtYears||0)+3;},
        chron:S=>`the Crown answered its creditors with fresh borrowing.`,
        out:"Another loan on worse terms. The polite gentlemen go away. They will not be polite indefinitely."}]},
  { id:"capitulation",w:9,freq:1,when:S=>debtPressure(S)>=14,
    title:"The Crown Cannot Pay",
    text:S=>`The payment is missed, and this time it is missed publicly. Within a month the creditors and the estates are sitting in the same room — which has never once happened in this realm's history for a good reason — and they have drafted terms rather than a petition.`,
    choices:[
      {label:"Accept the settlement",
        resolve:S=>{
          const hasCh=S.gov.institutions.length>0;
          return {cost:{stability:+4},fac:{merchants:+8,aristocracy:+5,peasantry:-4},
            effect:S2=>{
              S2._landsSold=Math.min(0.45,(S2._landsSold||0)+0.18);
              S2.treasury=Math.max(S2.treasury,-20); S2.debt=0; S2._debtYears=0;
              if(hasCh){ const inst=S2.gov.institutions[0];
                transferPower(S2,inst,Math.min(14,S2.gov.crown.power));
                if(!inst.rights.includes("tax"))inst.rights.push("tax");
              } else { forceChamber(S2,16); }
              S2.legitPen=(S2.legitPen||0)+6;
            },
            chron:S2=>`unable to pay, the Crown accepted the creditors' settlement: lands sold, and the purse placed under a standing chamber.`,
            out:`The debts are cleared and the price is written into the constitution. Crown lands are sold off — your receipts are permanently smaller — and ${hasCh?"the chamber takes the power of the purse, which no crown has ever taken back easily":"a standing chamber is called into being to hold the purse, which was precisely what you had spent a century avoiding"}. You are still sovereign. You are sovereign of less.`,fortune:"bad"};}},
      {label:"Repudiate the debt entirely",
        resolve:S=>({cost:{stability:-18},fac:{merchants:-24,aristocracy:-10,provinces:-6},
          effect:S2=>{S2.debt=0;S2.treasury=Math.max(S2.treasury,-10);S2._debtYears=0;
            S2._creditBonus=0; S2._costMod=(S2._costMod||1)*1.18; S2.legitPen=(S2.legitPen||0)+12;
            provinces(S2).forEach(p=>{p.loyalty=clamp(p.loyalty-8);});},
          chron:S2=>`the Crown repudiated its debts outright; credit died, and everything the realm bought thereafter cost more.`,
          out:"You simply refuse to pay. The bankers are ruined, the exchange closes, and nobody will lend to this crown again in your lifetime — which means everything from now on is paid for in cash, at a premium, forever. It is not a settlement. It is a wound you chose."})}]},

  /* ================= RUPTURE: ARISTOCRATIC REACTION ================= */
  { id:"react_warning",w:1.5,freq:2,when:S=>reactionPressure(S)>=4&&reactionPressure(S)<13,
    title:"The Great Houses Meet for the Hunting",
    text:S=>`Eleven of the first families are gathered at a country seat, ostensibly for the season. Their sons command regiments. Their chaplains preach to half the realm. The invitations went out before anyone thought to inform the court, and no one has thought to inform it since.`,
    choices:[
      {label:"Buy them back — honours, offices, exemptions",cost:{gold:-30},fac:{aristocracy:+14,clergy:+8,peasantry:-5},
        effect:S=>{S._reactYears=Math.max(0,(S._reactYears||0)-9);},
        chron:S=>`the Crown bought back the loyalty of the great houses with honours and exemptions.`,
        out:"Garters, sinecures and a quiet promise about the land tax. Everything you conceded here you will want back in fifty years."},
      {label:"Break the leading house as an example",cost:{stability:-9},fac:{aristocracy:-12,clergy:-5,peasantry:+7,officers:+4},
        effect:S=>{S._reactYears=(S._reactYears||0)+3;},
        chron:S=>`the Crown attainted the leading house of the realm to cow the rest.`,
        out:"Lands forfeit, a title extinguished, a family scattered. The other ten go home very quiet — and very clear about what the crown is now prepared to do."},
      {label:"Let them hunt",cost:{stability:-2},
        effect:S=>{S._reactYears=(S._reactYears||0)+4;},
        chron:S=>`the Crown took no notice of the gathering of the great houses.`,
        out:"They hunt. They talk. They go home. The invitations for next season go out earlier."}]},
  { id:"reaction",w:9,freq:1,when:S=>reactionPressure(S)>=13,
    title:"The Restoration of the Old Order",
    text:S=>`They do not call it a rebellion, because that would require admitting there is something to rebel against. The great houses and the bishops simply announce that the realm has been misgoverned, that the ancient constitution will be restored, and that the crown will be worn by someone more attentive to it.`,
    choices:[
      {label:"Resist — call the realm to the crown's defence",
        resolve:S=>{
          const strong=S.military>=50&&(S.facs.officers.mood>=50||S.facs.peasantry.mood>=55);
          if(strong) return {cost:{stability:-12,arms:-9,gold:-20},fac:{aristocracy:-16,clergy:-10,officers:+6,peasantry:+8},
            effect:S2=>{S2._reactYears=0;S2.facs.aristocracy.strength=clamp(S2.facs.aristocracy.strength-10);},
            chron:S2=>`the great houses moved to restore the old order and were broken; the aristocracy never recovered its former weight.`,
            out:"You call, and the realm comes — the regiments, the towns, and a startling number of people who have their own reasons to dislike dukes. The rising collapses. The old families are diminished permanently, which is a rare thing to be able to say.",fortune:"good"};
          return {cost:{stability:-16},fac:{aristocracy:+10,clergy:+8},
            effect:S2=>{doReaction(S2);},
            chron:S2=>`the Crown resisted the reaction and lost; the old order was restored over its body.`,
            out:"You call, and not enough comes. The gates open, the reforms are struck out one by one, and a more agreeable head is found for the crown.",fortune:"bad"};}},
      {label:"Submit, and keep what can be kept",cost:{stability:-8},fac:{aristocracy:+12,clergy:+9,merchants:-8},
        effect:S=>{doReaction(S);},
        chron:S=>`the Crown submitted to the reaction; the ancient constitution was restored and the throne changed hands.`,
        out:"You sign what is put in front of you. The chambers lose what they were given, the statutes are repealed, and the crown passes to someone the great houses find more restful. You are still the will behind the throne — it is simply a different throne now."}]},
  { id:"chamber_hunger",w:0.9,freq:5,when:S=>!S.pm&&S.gov.institutions.length>0&&S.gov.institutions[0].power<30,
    title:S=>`The ${S.gov.institutions[0].name} Demands More`,
    text:S=>`A chamber, once summoned, does not stay grateful. The ${S.gov.institutions[0].name} has drawn up a formal address: it holds too little power for the burdens laid upon it, and it wants more. The address is polite. The mood behind it is not.`,
    choices:[
      {label:"Grant a further measure of power",cost:{stability:+3},fac:{aristocracy:+5,clergy:+2},
        effect:S=>{transferPower(S,S.gov.institutions[0],8);},
        chron:S=>`the ${S.gov.institutions[0].name} pressed for a greater share of power, and the Crown yielded a measure gracefully.`,
        out:"You grant it before it must be taken. The chamber notes — approvingly — which kind of crown it serves."},
      {label:"Refuse the address",cost:{stability:-4},fac:{aristocracy:-6,clergy:-4},
        chron:S=>`the Crown refused the chamber's address for greater power; the refusal was filed, and remembered.`,
        out:"Refused with full ceremony. The address goes into the chamber's records — the kind of document that gets re-read in worse years."}]},
  { id:"commons_cry",w:0.8,freq:6,when:S=>S.gov.institutions.length>0&&!S.gov.institutions.some(i=>i.composition!=="nobility")&&(S.facs.merchants.strength+S.facs.peasantry.strength)>=95,
    title:"The Cry for a Commons",
    text:S=>`The realm below the great houses has grown too big to ignore: guild money, market towns, a countryside that reads. Petitions arrive from forty towns with one demand — a chamber of their own.`,
    choices:[
      {label:"Receive the petitioners warmly",cost:{stability:+4},fac:{merchants:+4,peasantry:+4,aristocracy:-3},
        chron:S=>`the Crown received the towns' great petition for a commons with warmth, and the question was opened that would not again close.`,

    choices:[
      {label:"Indulge the sovereign",cost:{gold:-12},fac:{aristocracy:+4},

        chron:S=>`the ministry declined the Crown's request, and the palace learned where policy was now made.`,
        out:"A frosty audience. The refusal stands — and so, a little more clearly, does the new order of things."}]},
  { id:"foreign_match",w:0.7,freq:5,title:"A Foreign Crown Proposes Alliance",

    choices:[
      {label:"Accept the alliance",cost:{arms:+6},fac:{aristocracy:+3,officers:+3},
        chron:S=>`${S.nation} bound itself to a powerful neighbour; the alliance outlasted the affection, as alliances do.`,
        out:"Vows exchanged with great pomp. You have a friend — and its enemies."},
      {label:"Decline and keep your hands free",cost:{stability:+2},fac:{merchants:+2},
        chron:S=>`${S.nation} declined the offered alliance and kept its independence unencumbered.`,
        out:"Refused with every courtesy. You owe no one, and no one owes you."}]},
];
function eligibleEvents(S){
  return EVENTS.filter(e=>{
    if(e.when&&!e.when(S))return false;
    const last=S.eventLast[e.id];
    if(last!=null){ if(e.freq===Infinity)return false; if(S.turn-last<e.freq)return false; }
    return true;
  });
}

/* =====================================================================
