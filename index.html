   ===================================================================== */
let S=null;
let PID=1;

function makePerson(S,rel,gender,age,name,parents){
  return { id:PID++, rel, gender:gender||(chance(0.5)?"m":"f"), age:age!=null?age:0,
    name:name||nameFor(gender||"m",usedNames(S)), alive:true,
    parents:parents||null, spouseId:null, born:(S?S.year-(age||0):0), trait:rollTrait(), job:null };
}
const TRAITS={
  shrewd:{name:"Shrewd",hint:"quick with a ledger",desc:"all acts of state cost less"},
  martial:{name:"Martial",hint:"happiest on a horse",desc:"the army holds its strength; officers warm"},
  pious:{name:"Pious",hint:"much at prayer",desc:"the church is content; legitimacy steadies"},
  curious:{name:"Curious",hint:"forever asking why",desc:"the realm learns faster under them"},
  frail:{name:"Frail",hint:"a sickly child",desc:"they will not be long-lived"},
  cruel:{name:"Cruel",hint:"unkind to servants",desc:"feared, obeyed, and quietly hated"},
  beloved:{name:"Beloved",hint:"the people's favourite",desc:"stability and legitimacy both lift"}
};
const TRAIT_KEYS=Object.keys(TRAITS);
function rollTrait(){ return chance(0.72)?pick(TRAIT_KEYS):null; }
function traitShown(p){
  if(!p||!p.trait)return null;
  if(p.age>=16)return {sure:true,text:TRAITS[p.trait].name};
  if(p.age>=8)return {sure:false,text:TRAITS[p.trait].hint};
  return null;
}
function traitMortality(p,base){ return p&&p.trait==="frail"?base*1.85:base; }
function personById(S,id){ if(S.monarch&&S.monarch.id===id)return S.monarch; return S.family.find(p=>p.id===id)||null; }

function newGame(cfg){
  const startYear=1600+rand(30);
  S={ nation:cfg.nation, startYear, year:startYear, turn:1, era:"Dynastic", culture:cfg.culture||"anglo",
    stability:50, military:36, development:18,
    treasury:50, debt:0, taxRate:"moderate", privileges:0,
    facs:newFactions(),
    gov:{ crown:{titleBase:cfg.title, selection:"hereditary", power:100}, institutions:[], cabinet:null, charter:null },
    law:cfg.law, designated:null,
    house:cfg.house, monarch:null, family:[], lineage:[],
    regency:null, rival:null, married:false,
    reforms:[], cooldowns:{}, eventLast:{}, seenMilestones:[],
    legitPen:0, notices:[], pm:null, nextElection:0, _elections:0,
    ui:{chronOpen:false}, _usedCands:[], ancestors:[],
    eraIdx:0, knowledge:0, advances:[], works:[], workCount:{}, provinces:[], lostProvinces:[], _know:{}, _advDiscount:1, _newActs:[], _prevActs:[],
    _successions:0,_sameHouseSucc:0,_houseBreaks:0,_regenciesEnded:0,_femaleReigns:0,_reforms:0,_events:0,
    chronicle:[], phase:"court", phaseDone:{event:false,court:false,advance:false,dynastic:false},
    tab:"govern", currentEvent:null, result:null, pending:null, openReform:null, _reformPower:null,_reformLaw:null,
    dyn:null, // pending dynastic beat
  };
  const g=chance(0.5)?"m":"f";
  S.monarch={ id:PID++, name:nameFor(g,new Set()), gender:g, age:30+rand(10), regnal:1, house:cfg.house, parents:null, spouseId:null, trait:rollTrait() };
  S.monarch.born=S.year-S.monarch.age; S.monarch.reignStart=S.year;
  /* the founding generation needs recorded parents, or a derived family
     graph reads the founder's own brothers and sisters as strangers */
  S.provinces=newProvinces(S);
  const oldKing=PID++, oldQueen=PID++;
  S.monarch.parents=[oldKing,oldQueen];
  // a sibling or two of the founder
  const sibCount=rand(3);
  for(let i=0;i<sibCount;i++){
    let sg=chance(0.5)?"m":"f";
    if((cfg.law==="agnatic"||cfg.law==="malepref")&&S.monarch.gender==="f") sg="f"; // a living brother would outrank her under this law
    const sage=S.monarch.age-1-rand(10); // founder's siblings are always younger than the founder
    S.family.push(makePerson(S,"sibling",sg,sage,null,[oldKing,oldQueen]));
  }
  S.deathRolled=false;
  S.chronicle.push({year:startYear,cls:"founding",
    text:`In ${startYear}, ${S.nation} was an absolute monarchy of the old kind, ruled by ${styled(S,S.monarch)} of the House of ${S.house}, whose word was law — and whose crown would pass by ${LAWS[S.law].name.toLowerCase()} right.`});
  beginTurn(true); render();
}

/* =====================================================================
   THE TURN: Event? -> Court -> Dynastic? -> advance
   ===================================================================== */
function beginTurn(first){
  refreshRelations(S);
  for(const k in S.facs){ const f=S.facs[k]; const m=Math.round(f.mood);
    f.delta=(f.lastMood!=null)?(m-f.lastMood):0; f.lastMood=m; }
  S.phaseDone={event:false,court:false,advance:false,dynastic:false};
  S.currentEvent=null; S.result=null; S.openReform=null; S.pending=null; S.dyn=null;
  S.tab="govern";
  ensureRegent();
  if(S.notices&&S.notices.length){ S.phase="tidings"; return; }
  proceedToElection(first);
}
function afterTidings(){ S.notices=[]; proceedToElection(false); render(); }
function proceedToElection(first){
  if(S.pm&&S._minority&&chance(0.45)){
    S._minority=false; S.stability=clamp(S.stability-5);
    S.chronicle.push({year:S.year,text:`In ${S.year}, the Crown's minority ministry lost the confidence of the chamber and fell.`});
    S._electionResult=runElection(); S.phase="election"; return;
  }
  if(S.pm&&S.turn<S.nextElection&&S.facs[S.pm.bloc].mood<30){
    S.stability=clamp(S.stability-4);
    S.chronicle.push({year:S.year,text:`In ${S.year}, the ${S.facs[S.pm.bloc].name} benches lost confidence in their own ministry, and the government fell to an early election.`});
    S._electionResult=runElection(); S.phase="election"; return;
  }
  if(S.pm&&S.turn>=S.nextElection){ S._electionResult=runElection(); S.phase="election"; return; }
  rollEvent(first);
}
function afterElection(){
  const er=S._electionResult; S._elections=(S._elections||0)+1; S.nextElection=S.turn+4;
  if(er&&er.winner!==S.pm.bloc){ S.pm.bloc=er.winner; S.pm.holder=pmName(); S.pm.age=44+rand(16);
    S.chronicle.push({year:S.year,text:`In ${S.year}, the election turned the government out: the ${S.facs[er.winner].name} interest took the ministry, and ${S.pm.holder} took office as ${S.pm.office}.`});
  } else if(er){
    if(S.pm.age>=68){ const old=S.pm.holder; S.pm.holder=pmName(); S.pm.age=44+rand(16);
      S.chronicle.push({year:S.year,text:`In ${S.year}, the ${S.facs[er.winner].name} interest was returned — but ${old}, grown old in office, gave way to ${S.pm.holder}.`});
    } else S.chronicle.push({year:S.year,text:`In ${S.year}, the government of the ${S.facs[er.winner].name} interest was returned at the polls.`});
  }
  S._electionResult=null; checkMilestones(); rollEvent(false); render();
}
function rollEvent(first){
  if(first){ S.phaseDone.event=true; S.phase="court"; return; }
  const pool=eligibleEvents(S);
  /* a quiet reign is a rare thing — and gets rarer as the realm grows more
     complicated to govern */
  const eventOdds=Math.min(0.82, 0.62 + eraIdx(S)*0.04 + (S.stability<40?0.08:0));
  if(pool.length&&chance(eventOdds)){
    const total=pool.reduce((a,e)=>a+(e.w||1),0); let r=Math.random()*total; let ch=pool[0];
    for(const e of pool){ r-=e.w||1; if(r<=0){ch=e;break;} }
    S.currentEvent=ch; S.eventLast[ch.id]=S.turn; S.phase="event"; return;
  }
  S.phase="quiet";
}
function afterEvent(){ S.phaseDone.event=true; S.currentEvent=null; S.phase="court"; S.result=null; render(); }
function routeNext(nx){
  if(nx==="court"){afterEvent();}
  else if(nx==="dynastic"){afterCourt();}
  else if(nx==="advance"){afterAdvance();}
  else if(nx==="dyncourt"){toDynCourt();}
  else if(nx==="endturn"){toDynCourt();}
  else if(nx==="fresh"){beginTurn(false);render();}
  else {render();}
}
function continueFlow(){
  const nx=S.result&&S.result.next; S.result=null;
  if(S._forcedChamber){ S._afterName=nx; S.phase="chname"; render(); return; }
  if(S._pmPending&&!S.pm){ S._pmPending=false; S._afterName=nx; S.phase="pmname"; render(); return; }
  routeNext(nx);
}
function afterCourt(){
  S.phaseDone.court=true; S.result=null;
  if(!S.phaseDone.advance){ S.phase="advance"; render(); return; }
  toDynastic();
}
function afterAdvance(){
  S.phaseDone.advance=true; S.result=null; toDynastic();
}
function toDynastic(){
  const beat=dynasticBeat();
  if(beat){ S.dyn=beat; S.phase="dynastic"; render(); return; }
  toDynCourt();
}
function toDynCourt(){ S.dyn=null; S.result=null; S.phase="dyncourt"; render(); }

const ROLES=[
  {id:"marshal",name:"Marshal of the Host",dom:"martial",fac:{officers:+7},
   hint:"command of the armies given to one of the blood",gives:"Arms hold steadier · officers warm to the house"},
  {id:"primate",name:"Primate of the Realm",dom:"faith",fac:{clergy:+8},
   hint:"a mitre for a royal child — the church bound to the dynasty",gives:"Clergy warm · legitimacy steadies"},
  {id:"governor",name:"Governor of the Provinces",dom:"civil",fac:{provinces:+7},
   hint:"the far country given a face it recognizes",gives:"Provinces warm · unrest in the country softens"},
  {id:"chancellor",name:"Chancellor of the Exchequer",dom:"fiscal",fac:{merchants:+6},
   hint:"the purse entrusted to kin rather than to strangers",gives:"Merchants warm · the treasury runs a little better"}
];
function roleHolder(S,id){ return S.family.find(p=>p.alive&&p.job===id)||null; }
function roleEligible(S){
  const h=heirOf(S);
  return S.family.filter(p=>p.alive&&p.age>=16&&!p.job&&p.rel!=="former"&&(!h||p.id!==h.id)
    &&["child","sibling","uncle","nephew","grandchild"].includes(p.rel));
}
function matchCandidates(S,p){
  const key="m"+p.id;
  if(S._matchC&&S._matchC.key===key) return S._matchC.list;
  const sg=p.gender==="m"?"f":"m";
  const used=usedNames(S);
  const list=[
    {kind:"foreign",name:nameFor(sg,used),house:pick(housePool()),age:Math.max(16,p.age-5+rand(11)),
     note:"kin of a crown beyond the border",chips:[["down","−14 gold"],["up","+4 Arms"],["up","a friend abroad"]]},
    {kind:"domestic",name:nameFor(sg,used),house:pick(housePool()),age:Math.max(16,p.age-4+rand(9)),
     note:"of a great house of the realm",chips:[["fac up","Aristocracy +7"],["up","the old blood bound closer"]]},
    {kind:"love",name:nameFor(sg,used),house:null,age:Math.max(16,p.age-3+rand(7)),
     note:"no house worth the name — but they will not be told no",chips:[["up","+6 Stability"],["up","a fertile and willing marriage"],["fac down","Aristocracy −6"],["down","no alliance"]]}
  ];
  S._matchC={key,list};
  return list;
}
function renderDynCourt(){
  const h=heirOf(S);
  const unwed=S.family.filter(p=>p.alive&&p.age>=16&&!p.spouseId&&["child","sibling","uncle","nephew","grandchild"].includes(p.rel));
  const elig=roleEligible(S);
  let opts="";
  if(!spouseOf(S)&&S.monarch.age>=16&&!S.regency)
    opts+=`<button class="choice dyn-match" data-dc="wedself"><div class="cl"><span class="mk">♥</span><span class="lbl">Seek a consort for ${esc(styled(S,S.monarch))}</span></div>
      <div class="ch">the sovereign is unwed — and an unwed crown is a succession waiting to go wrong</div>
      <div class="costs"><span class="chip">opens the question of marriage</span></div></button>`;
  opts+=unwed.map(p=>`<button class="choice dyn-match" data-dcwed="${p.id}"><div class="cl"><span class="mk">♥</span><span class="lbl">Arrange a match for ${esc(p.name)}, the sovereign's ${esc(relLabel(p))} (${p.age})</span></div>
      <div class="ch">of age, unwed, and watched by every house with a daughter or a son</div>
      <div class="costs"><span class="chip">three suits are pressed</span></div></button>`).join("");
  opts+=ROLES.filter(r=>!roleHolder(S,r.id)&&elig.length).map(r=>`<button class="choice dyn-role" data-dcrole="${r.id}"><div class="cl"><span class="mk">✦</span><span class="lbl">Appoint a ${esc(r.name)}</span></div>
      <div class="ch">${esc(r.hint)}</div>
      <div class="costs">${Object.keys(r.fac).map(k=>`<span class="chip fac up">${S.facs[k].name} +${r.fac[k]}</span>`).join("")}<span class="chip">${esc(r.gives)}</span></div></button>`).join("");
  const desig=designatable(S).filter(p=>!h||p.id!==h.id);
  if(desig.length&&!S.regency)
    opts+=`<button class="choice dyn-desig" data-dc="designate"><div class="cl"><span class="mk">›</span><span class="lbl">Name an heir by the sovereign's own will</span></div>
      <div class="ch">${h?`the law would give the crown to ${esc(h.name)} — you need not agree`:"no heir stands by law; someone must be chosen"}</div>
      <div class="costs"><span class="chip">passing over the lawful line has a price</span></div></button>`;
  const held=ROLES.filter(r=>roleHolder(S,r.id));
  return `<div class="eyebrow">The dynastic court</div><div class="sit-title">The House of ${esc(S.house)}</div>
    <div class="sit-text">Marriages, offices and the question of who follows. You may do as much of this as the season allows${S.regency?" — though a regency ties the sovereign's hands":""}.</div>
    ${held.length?`<div class="sit-text" style="color:var(--brass-dim);font-size:12.5px">${held.map(r=>`${esc(roleHolder(S,r.id).name)} serves as ${esc(r.name)}.`).join(" ")}</div>`:""}
    <div class="choices">${opts||`<div class="sit-text">The house has no business this season that cannot wait.</div>`}</div>
    <div class="choices"><button class="choice" data-dc="done"><div class="cl"><span class="mk">›</span><span class="lbl">Conclude the season</span></div>
      <div class="ch">the years turn</div></button></div>`;
}
function renderMatch(){
  const p=S._matchFor==="self"?S.monarch:S.family.find(x=>x.id===S._matchFor);
  if(!p){toDynCourt();return "";}
  const cands=matchCandidates(S,p);
  return `<div class="eyebrow">A match for the house</div><div class="sit-title">Suits for ${esc(p.name)}</div>
    <div class="sit-text">${esc(p.name)}, ${p.age}, is of age. Three suits are pressed — two by houses, one by nobody at all.</div>
    <div class="choices">${cands.map((c,i)=>`<button class="choice ${c.kind==="love"?"dyn-love":"dyn-match"}" data-match="${i}">
      <div class="cl"><span class="mk">${["I","II","III"][i]}</span><span class="lbl">${esc(c.name)}${c.house?` of House ${esc(c.house)}`:""} (${c.age})</span></div>
      <div class="ch">${esc(c.note)}</div>
      <div class="costs">${c.chips.map(([cl,t])=>`<span class="chip ${cl}">${esc(t)}</span>`).join("")}</div></button>`).join("")}
      <button class="choice" data-match="-1"><div class="cl"><span class="mk">›</span><span class="lbl">Let them wait</span></div>
      <div class="ch">the envoys will return</div></button></div>`;
}
function doMatch(i){
  const p=S._matchFor==="self"?S.monarch:S.family.find(x=>x.id===S._matchFor);
  const cands=matchCandidates(S,p); S._matchC=null;
  if(!p||i<0){ S._matchFor=null; toDynCourt(); return; }
  const c=cands[i]; const sg=p.gender==="m"?"f":"m";
  const isSelf=(S._matchFor==="self");
  const sp=makePerson(S,isSelf?"spouse":(p.rel==="child"?"childspouse":"inlaw"),sg,c.age,c.name);
  sp.spouseId=p.id; p.spouseId=sp.id; S.family.push(sp);
  if(isSelf)S.married=true;
  S._matchFor=null;
  S._celebrate={label:`the wedding of ${p.name}`,turn:S.turn+1};
  let out;
  if(c.kind==="foreign") out={cost:{gold:-14,arms:+4},fac:{aristocracy:+2},
    chron:S=>`${p.name} of the royal house wed ${c.name}, kin of the crown of House ${c.house}.`,
    out:`A wedding of state. Two realms are joined at the altar, whatever they may do to each other later.`};
  else if(c.kind==="domestic") out={fac:{aristocracy:+7},
    chron:S=>`${p.name} of the royal house wed ${c.name} of House ${c.house}, of the realm's own great blood.`,
    out:`Old blood binds closer to the crown. One great house is now family — and behaves accordingly, for good and ill.`};
  else { sp.love=true; p.love=true;
    out={cost:{stability:+6},fac:{aristocracy:-6,peasantry:+4},
    chron:S=>`${p.name} of the royal house married ${c.name} for no reason of state whatever, and the realm rather enjoyed it.`,
    out:`No alliance, no dowry, no advantage — and a marriage the whole country is fond of. The great houses are furious. The couple do not appear to notice.`};}
  applyOutcome(out,"dyncourt"); render();
}
function doRole(id){
  const r=ROLES.find(x=>x.id===id); const elig=roleEligible(S);
  if(!r||!elig.length){toDynCourt();return;}
  const p=elig.sort((a,b)=>b.age-a.age)[0];
  p.job=r.id;
  let extra="";
  if(r.id==="governor"){
    /* send them where they are most needed */
    const target=provinces(S).filter(x=>!x.core&&!x.governor).sort((a,b)=>a.loyalty-b.loyalty)[0]
      ||provinces(S).filter(x=>!x.governor)[0];
    if(target){ target.governor=p.id; target.loyalty=clamp(target.loyalty+8);
      extra=` ${p.name} rides for ${target.name}, whose loyalty was the thinnest in the realm.`; }
  }
  applyOutcome({fac:r.fac,chron:S=>`${p.name} of the royal house was made ${r.name}.`,
    out:`${p.name} takes up the office of ${r.name}.${extra} A royal face where the realm can see it — and a royal relation with a power base of their own, which has gone well roughly half the time in history.`},"dyncourt");
  render();
}
function doWillDesignate(pid,nx){
  const p=S.family.find(x=>x.id===pid&&x.alive); if(!p){toDynCourt();return;}
  const lawful=heirOf(S);
  const d=kinDistance(S,p);
  const passedOver=lawful&&lawful.id!==p.id;
  S.designated=p.id;
  let stab=0,legit=0,ari=0;
  if(passedOver){ stab=-4-d*2; legit=3+d*2; ari=-3-d; }
  S.stability=clamp(S.stability+stab); S.legitPen=(S.legitPen||0)+legit;
  if(passedOver&&lawful&&lawful.age>=14&&chance(0.35+d*0.06)) S.rival=lawful;
  applyOutcome({fac:{aristocracy:ari},
    chron:S=>`${styled(S,S.monarch)} named ${p.name} heir to the crown${passedOver?`, passing over ${lawful.name}, whom the law preferred`:""}.`,
    out:passedOver?`The instrument is sealed. ${p.name} is heir by the sovereign's will rather than the realm's custom${S.rival&&S.rival.id===lawful.id?`, and ${lawful.name} has left court without asking leave. That is a claim now, not a grievance.`:". The great houses take note of how little the law weighed."}`
      :`${p.name} is confirmed heir — the law and the sovereign's will agreeing, which is rarer than it sounds.`},nx||"dyncourt");
  render();
}
function renderDesignate(){

    <div class="choices">${list.map(p=>{const d=kinDistance(S,p);const over=lawful&&lawful.id!==p.id;

function afterDynastic(){ S.phaseDone.dynastic=true; S.result=null; endTurn(); render(); }

function endTurn(){
  const span=3+rand(3); // 3-5 years
  S.year+=span; S.turn++;
  // ages
  S.monarch.age+=span; S.family.forEach(p=>{ if(p.alive)p.age+=span; });
  if(S.regency){ S.regency.age+=span;
    const rp=S.regency.personId?S.family.find(p=>p.id===S.regency.personId):null;
    if(S.regency.personId&&(!rp||!rp.alive)){
      const old=S.regency.name; S.regency=newRegent(); S.stability=clamp(S.stability-4);
      S.chronicle.push({year:S.year,text:`In ${S.year}, ${old} died with the sovereign still in minority, and ${S.regency.name} took up the seals.`});
      S.notices.push(`${old} has died. ${S.regency.name} now holds the regency.`);
    } else if(!S.regency.personId&&chance(mortalityChance(S.regency.age,span))){
      const old=S.regency.name; S.regency=newRegent(); S.stability=clamp(S.stability-4);
      S.chronicle.push({year:S.year,text:`In ${S.year}, ${old} died with the sovereign still in minority, and ${S.regency.name} took up the seals in their place.`});
      S.notices.push(`${old} has died. ${S.regency.name} now holds the regency — with friends of their own.`);
    }
    if(S.monarch.age>=16){ S.chronicle.push({year:S.year,cls:"reign",text:`In ${S.year}, ${styled(S,S.monarch)} came of age, and the regency of ${S.regency.name} was dissolved; the sovereign ruled at last in their own right.`}); S.regency=null; S._regenciesEnded++; } }
  // budget
  const net=netIncome(S); S.treasury+=Math.round(net*span/3);
  S.treasury=Math.max(-(250+(S._creditBonus||0)),Math.min(999,S.treasury));
  S.debt=S.treasury<0?-S.treasury:0;
  // tax drift
  const t=TAX_TIERS[S.taxRate]; S.stability=clamp(S.stability+t.stab);
  for(const k in (t.fac||{})){ S.facs[k].mood=clamp(S.facs[k].mood+t.fac[k]); }
  tickProvinces(S,span);
  /* rupture weather accumulates in years, and drains when things improve */
  const deep=S.treasury<-(90+(S._creditBonus||0)*0.4);
  S._debtYears = deep ? (S._debtYears||0)+span : Math.max(0,(S._debtYears||0)-span);
  const nobles=(S.facs.aristocracy.mood+S.facs.clergy.mood)/2;
  const sour = nobles<30 && S.stability<45;
  S._reactYears = sour ? (S._reactYears||0)+span : Math.max(0,(S._reactYears||0)-span*1.5);
  if(S._celebrate&&S._celebrate.turn<S.turn)S._celebrate=null;
  // knowledge accrues
  S.knowledge=Math.round((S.knowledge+knowledgeIncome(S)*span)*10)/10;
  // development creep
  if(S.stability>(S.gov.cabinet?50:58))S.development=clamp(S.development+1);
  if(S.gov.cabinet&&S.stability<60)S.stability=clamp(S.stability+1);
  // contentment fades from above; grievances heal slowly from below
  for(const k in S.facs){ const f=S.facs[k]; if(f.present){
    if(f.mood>50) f.mood-=(f.mood-50)*0.08;
    else if(f.mood<40) f.mood+=(40-f.mood)*0.12;
    if(S.regency) f.mood-=1;
    f.mood=clamp(f.mood); } }
  const mt=S.monarch&&S.monarch.trait;
  if(mt==="martial"){ S.military=clamp(S.military+1); S.facs.officers.mood=clamp(S.facs.officers.mood+1); }
  if(mt==="pious"){ S.facs.clergy.mood=clamp(S.facs.clergy.mood+1); }
  if(mt==="beloved"){ S.stability=clamp(S.stability+2); }
  if(mt==="cruel"){ S.stability=clamp(S.stability-1); S.facs.peasantry.mood=clamp(S.facs.peasantry.mood-1); }
  S.legitPen=Math.max(0,(S.legitPen||0)-(mt==="beloved"?4:mt==="pious"?3:2));
  if(S.regency) S.treasury-=3;
  S.family=S.family.filter(p=>p.alive||p.parents||p.spouseId||["child","sibling","spouse","childspouse","grandchild"].includes(p.rel));
  if(S.treasury<-15)S.stability=clamp(S.stability-5);
  if(S.treasury<=-200){S.treasury=-120;S.privileges=Math.max(0,S.privileges-2);S.military=clamp(S.military-8);S.facs.merchants.mood=clamp(S.facs.merchants.mood-8);S.chronicle.push({year:S.year,cls:'rupture',text:'In '+S.year+', the Crown of '+S.nation+' defaulted upon its debts; creditors were ruined, privileges revoked, and regiments disbanded to stanch the bleeding.'});}
  if(S.facs.aristocracy.mood<30||S.facs.peasantry.mood<28)S.stability=clamp(S.stability-4);
  if(S.rival)S.stability=clamp(S.stability-2);
  // births
  maybeBirth(span);
  // deaths in the family + monarch mortality
  rollDeaths(span);
  if(S._abdicate){ S._abdicate=false; S.monarch.alive=false; }
  if(S.pm){ S.pm.age+=span;
    if(chance(mortalityChance(S.pm.age,span))){ const old=S.pm.holder;
      S.pm.holder=pmName(); S.pm.age=44+rand(16);
      S.chronicle.push({year:S.year,text:`In ${S.year}, ${old} died in office, and the ${S.facs[S.pm.bloc].name} interest raised ${S.pm.holder} to the ministry in their place.`});
      S.notices.push(`${old}, the ${S.pm.office}, has died in office. ${S.pm.holder} now holds the seals of government.`);
    } }
  checkMilestones();
  // next turn begins — unless the monarch died (succession phase pending)
  if(!S.monarch.alive){ S.phase="succession"; return; }
  if(S.stability<=5){ S.currentEvent=REVOLT; S.eventLast["revolt"]=S.turn; S.phase="event"; S.phaseDone={event:false,court:false,dynastic:false}; return; }
  beginTurn(false);
}

function spouseOf(S){ return S.family.find(p=>p.rel==="spouse"&&p.alive); }
function maybeBirth(span){
  const sp=spouseOf(S);
  if(sp){
    const bearer=(S.monarch.gender==="f")?S.monarch.age:sp.age;
    if(bearer>=17&&bearer<=45){
      const kids=S.family.filter(p=>p.rel==="child"&&p.alive).length;
      const p=Math.min(0.85, span*0.16*(kids<2?1.4:kids<4?1:0.5)*(S.monarch.love?1.3:1));
      if(chance(p)){
        const g=chance(0.5)?"m":"f";
        const c=makePerson(S,"child",g,0,null,[S.monarch.id,sp.id]);
        S.family.push(c);
        S.chronicle.push({year:S.year,text:`In ${S.year}, a ${g==="m"?"son":"daughter"}, ${c.name}, was born to ${styled(S,S.monarch)}.`});
        S.notices.push({t:"b",name:c.name,g:g});
        S._celebrate={label:`the birth of ${c.name}`,turn:S.turn+1};
      }
    }
  }
  S.family.filter(c=>(c.rel==="sibling"||c.rel==="uncle")&&c.alive&&c.spouseId).forEach(c=>{
    const cs=personById(S,c.spouseId); if(!cs||!cs.alive)return;
    const bearer=(c.gender==="f")?c.age:cs.age;
    if(bearer<17||bearer>45)return;
    const kd=S.family.filter(x=>x.parents&&x.parents.includes(c.id)&&x.alive).length;
    if(chance(Math.min(0.3, span*0.07*(kd<2?1:0.4)))){
      const g=chance(0.5)?"m":"f";
      const nc=makePerson(S,c.rel==="sibling"?"nephew":"kin",g,0,null,[c.id,cs.id]);
      S.family.push(nc);
      S.notices.push(`${c.name} has been delivered of a ${g==="m"?"son":"daughter"}, ${nc.name}.`);
    }
  });
  S.family.filter(c=>c.rel==="child"&&c.alive&&c.spouseId).forEach(c=>{
    const cs=personById(S,c.spouseId); if(!cs||!cs.alive)return;
    const bearer=(c.gender==="f")?c.age:cs.age;
    if(bearer<17||bearer>45)return;
    const gk=S.family.filter(x=>x.rel==="grandchild"&&x.alive&&x.parents&&x.parents.includes(c.id)).length;
    if(chance(Math.min(0.4, span*0.09*(gk<2?1.2:0.5)))){
      const g=chance(0.5)?"m":"f";
      const gc=makePerson(S,"grandchild",g,0,null,[c.id,cs.id]);
      S.family.push(gc);
      S.notices.push(`${c.name} has been delivered of a ${g==="m"?"son":"daughter"}, ${gc.name} — a grandchild to the sovereign.`);
    }
  });
}
function rollDeaths(span){
  S.monarch.alive=S.monarch.alive!==false;
  S.family.forEach(p=>{ if(p.alive&&chance(traitMortality(p,mortalityChance(p.age,span))*(1-(S._mortalityEase||0)))){ p.alive=false; p.diedTurn=S.turn;
    S.chronicle.push({year:S.year,text:`In ${S.year}, the court mourned ${p.name}, ${relLabel(p)} of the sovereign, dead at ${p.age}.`});
    S.notices.push({t:"d",id:p.id,name:p.name,age:p.age});
    if(p.rel==="spouse"){ S.married=false; }
  }});
  if(S.rival&&!S.family.find(p=>p.id===S.rival.id&&p.alive)) S.rival=null;
  // monarch death
  if(chance(traitMortality(S.monarch,mortalityChance(S.monarch.age,span))*(1-(S._mortalityEase||0)))){ S.monarch.alive=false;
    S.chronicle.push({year:S.year,cls:"reign",text:`In ${S.year}, ${styled(S,S.monarch)} died at the age of ${S.monarch.age}.`}); }
}

function newRegent(){
  // the surviving parent takes the regency first, if one lives
  const dow=S.family.find(p=>p.alive&&(p.rel==="dowager"||p.rel==="spouse")&&S.monarch.parents&&S.monarch.parents.includes(p.id));
  if(dow) return {name:`${dow.name}, the Dowager Regent — the sovereign's own ${dow.gender==="f"?"mother":"father"}`,
    age:dow.age, gender:dow.gender, favors:pick(["aristocracy","clergy"]), hostile:false, personId:dow.id};
  const g=chance(0.7)?"m":"f";
  const given=nameFor(g,usedNames(S));
  return {name:`${g==="m"?"Lord":"Lady"} ${given}, ${pick(["the Lord Protector","the High Steward","Regent of the Realm"])}`,
    given, house:pick(housePool()),
    age:42+rand(20), gender:g, favors:pick(["aristocracy","clergy","officers","merchants"]), hostile:false};
}
function ensureRegent(){
  if(!S.regency||!S.regency.personId)return;
  const rp=S.family.find(p=>p.id===S.regency.personId);
  if(!rp||!rp.alive){
    const old=S.regency.name; S.regency=newRegent(); S.stability=clamp(S.stability-4);
    S.chronicle.push({year:S.year,text:`In ${S.year}, ${old} died with the sovereign still in minority, and ${S.regency.name} took up the seals.`});
    S.notices.push(`${old} has died. ${S.regency.name} now holds the regency.`);
  }
}

function ownsAdv(S,id){ return (S.advances||[]).includes(id); }
function workCount(S,id){ return (S.workCount&&S.workCount[id])||0; }
function ownsWork(S,id){ return workCount(S,id)>0; }
function workMax(w){ return w.max||3; }
/* each further foundation costs more and yields less — the third university
   is a fine thing, but it is not the first university */
function workGold(S,w){ return Math.round(w.gold*(1+0.65*workCount(S,w.id))); }
function workYield(w,n){ const step=[1,0.6,0.38,0.25]; return w.know*(step[n]||0.2); }
function worksKnowledge(S){
  let k=0;
  WORKS.forEach(w=>{ const n=workCount(S,w.id); for(let i=0;i<n;i++) k+=workYield(w,i); });
  return k;
}
function advCost(S,a){
  const base=ERAS[a.era]?ERAS[a.era].cost:200;
  const era=eraIdx(S);
  let m=1;
  if(a.era>era) m=2.2;               // reaching past your age is expensive
  m*=(S._advDiscount||1);
  return Math.max(4,Math.round(base*m));
}
function knowledgeIncome(S){
  const k=S._know||{};
  let per = 0.30 + S.development*0.030 + (k.admin||0) + (k.press||0);
  per+=worksKnowledge(S);
  if(S.monarch&&S.monarch.trait==="curious") per*=1.22;
  if(S.stability<35) per*=0.75;
  if(S.regency) per*=0.85;
  per*=(k.mult||1);
  per*=(1+((S.advances||[]).length*0.028));
  return per;
}
function availableAdvances(S){
  const era=eraIdx(S);
  return ADVANCES.filter(a=>!ownsAdv(S,a.id)&&a.era<=era+1);
}
function availableWorks(S){
  const era=eraIdx(S);
  return WORKS.filter(w=>w.era<=era&&workCount(S,w.id)<workMax(w));
}
function foundationsHeld(S,era){
  return ADVANCES.filter(a=>a.era===era&&a.found&&ownsAdv(S,a.id)).length;
}
function checkEraAdvance(S){
  const era=eraIdx(S);
  if(era>=ERAS.length-1) return false;
  if(foundationsHeld(S,era)<2) return false;
  S.eraIdx=era+1; S.era=ERAS[S.eraIdx].name;
  const behind=S.year-(1614+S.eraIdx*95);
  S.chronicle.push({year:S.year,cls:"mstone",
    text:`In ${S.year}, ${S.nation} passed into its ${ERAS[S.eraIdx].name} age${behind<-25?" — a lifetime ahead of the world beyond its borders":behind>60?", long after its neighbours had done the same":""}. ${ERAS[S.eraIdx].blurb}`});
  S.notices.push(`The realm has entered the age of ${ERAS[S.eraIdx].name}. The court's business is not what it was.`);
  try{
    const now=availableActions(S).map(a=>a.id);
    const prev=S._prevActs||[];
    const renamed=now.filter(id=>ACT_EVO[id]&&Object.keys(ACT_EVO[id]).map(Number).includes(S.eraIdx));
    /* on the very first crossing the previous list is empty — don't tag the
       whole toolbox as new, only what genuinely arrived or changed its name */
    S._newActs=prev.length?now.filter(id=>!prev.includes(id)).concat(renamed):renamed;
    S._prevActs=now;
  }catch(e){}
  return true;
}

/* ---------- dynastic beats ---------- */
function dynasticBeat(){
  const m=S.monarch;
  if(S.regency&&!S.regency.personId&&S.monarch.age<=12&&chance(S.regency.hostile?0.16:0.07)) return {kind:"regent_coup"};
  if(S.regency&&chance(0.35)) return {kind:"regent"};
  const spAlive=spouseOf(S);
  const succNeeds=!heirOf(S)||m.age<35;
  if(!spAlive&&m.age>=16&&succNeeds&&(m.gender==="m"||m.age<=44)) return {kind:"marriage"};
  const single=S.family.filter(p=>(p.rel==="child"||p.rel==="sibling"||(S.regency&&p.rel==="uncle"))&&p.alive&&p.age>=17&&p.age<=45&&!p.spouseId);
  if(S.rival){ const rv=S.family.find(p=>p.id===S.rival.id&&p.alive);
    if(rv&&chance(Math.min(0.5,0.2+(50-S.stability)*0.006))) return {kind:"banners",rival:rv}; }
  if(single.length&&chance(0.5)) return {kind:"heirmatch",child:pick(single)};
  // heir designation reminders / adoption when childless & aging
  const kids=S.family.filter(p=>p.rel==="child"&&p.alive);
  if(S.law!=="elective"&&!kids.length&&!S.designated&&m.age>=40) return {kind:"childless"};
  // sibling ambition: an adult male sibling under agnatic/malepref w/ no sons, or any strong sibling when stability low
  const sibs=S.family.filter(p=>p.rel==="sibling"&&p.alive&&p.age>=18&&!p.exiled&&!p.placated);
  if(!S.rival&&sibs.length&&chance(0.3)){
    const threatened=(S.law!=="elective")&&(!heirOf(S)||S.stability<35);
    if(threatened) return {kind:"ambition",sib:pick(sibs)};
  }
  // heir comes of age (flavor + optional designation confirmation)
  const h=heirOf(S);
  if(h&&h.age>=16&&!h._noted){ h._noted=true; return {kind:"ofage",heir:h}; }
  return null;
}

/* =====================================================================
   SUCCESSION
   ===================================================================== */
function successionOptions(){
  const heir=heirOf(S);
  if(S.rival){ const rv=S.family.find(p=>p.id===S.rival.id&&p.alive);
    if(rv&&S.law!=="elective") return {mode:"contested",heir,rival:rv}; }
  if(S.law==="elective"){
    return {mode:"elective"};
  }
  if(heir){
    return {mode:"heir",heir};
  }
  // no heir: siblings can continue the House; else crisis
  const sibs=S.family.filter(p=>p.rel==="sibling"&&p.alive&&p.age>=16);
  return {mode:"crisis",sibs};
}
function crownPerson(p,houseName,viaCrisis){
  S.lineage.push({id:S.monarch.id,name:S.monarch.name,birthName:S.monarch.birthName||null,regnal:S.monarch.regnal,house:S.monarch.house,gender:S.monarch.gender,start:S.monarch.reignStart||null,end:S.year,born:S.monarch.born||null});
  S.ancestors=S.ancestors||[];
  const oldM=Object.assign({},S.monarch); oldM.died=S.year; oldM.alive=false; S.ancestors.push(oldM);
  const newHouse=houseName||S.house;
  const sameHouse=newHouse===S.house;
  /* Relations are derived, not rewritten. The only question a succession
     has to answer is whether the crown has LEFT this family altogether —
     if a stranger takes it, the old house withdraws from court but stays
     in the record. Everything else recomputes itself from the graph. */
  const bloodTie=bloodRel(S,S.monarch.id,p.id);
  const strangerTook=!bloodTie&&!(p.spouseId&&bloodRel(S,S.monarch.id,p.spouseId));
  if(strangerTook){
    let withdrew=false;
    S.family.forEach(q=>{ if(q.id!==p.id&&!q.outHouse){ q.outHouse=true; if(q.alive)withdrew=true; } });
    if(withdrew)
      S.chronicle.push({year:S.year,text:`In ${S.year}, the old royal family withdrew from court, their titles courtesy and their future uncertain.`});
  }
  // remove crowned person from family list
  S.family=S.family.filter(q=>q.id!==p.id);
  S.house=newHouse;
  S.monarch={ id:p.id||PID++, name:p.name, gender:p.gender, age:p.age, house:newHouse, regnal:regnalFor(S,p.name,newHouse), alive:true, parents:p.parents||null, spouseId:p.spouseId||null, born:p.born||(S.year-p.age) };
  if(p.gender==="f")S._femaleReigns++;
  S._successions++;
  if(sameHouse&&!viaCrisis)S._sameHouseSucc++;
  if(!sameHouse){S._houseBreaks++; S._sameHouseSucc=0;}
  S.designated=null; S.rival=null;
  S.monarch.reignStart=S.year;
  refreshRelations(S);
  S.married=!!S.family.find(q=>q.alive&&q.id===S.monarch.spouseId);
  // regency?
  if(S.monarch.age<16){ S.regency=newRegent(); S.stability=clamp(S.stability-8); }
}

function crisisCandidates(byArms){
  const houses=[]; while(houses.length<3){ const h=pick(housePool()); if(!houses.includes(h))houses.push(h); }
  S._usedCands=S._usedCands||[];
  return houses.map(h=>{ const g=chance(0.5)?"m":"f";
    const used=new Set([...(S._usedCands),...usedNames(S)]);
    const nm=nameFor(g,used); S._usedCands.push(nm);
    return { name:nm, gender:g, age:25+rand(20), house:h,
      note: (byArms? pick(["commands the border legions","backed by the veteran regiments","holds the capital garrison"])
                  : pick(["the wealthiest house in the realm","backed by the merchant banks","master of the grain trade"]))
            +(S.lineage.some(l=>l.house===h)?" — an old claimant house returns":"") }; });
}

/* ---------- rupture machinery ---------- */
function forceChamber(S,power){
  const nm=(typeof culture==="function"?culture(S).inst[0]:"The Estates");
  const inst={id:"ch"+S.gov.institutions.length,name:nm,composition:"nobility",
    power:0,rights:["tax","consent"]};
  S.gov.institutions.push(inst);
  transferPower(S,inst,Math.min(power,S.gov.crown.power));
  S.chronicle.push({year:S.year,cls:"mstone",text:`In ${S.year}, ${nm} was called into being — not by the Crown's grace but by its creditors.`});
}
/* the aristocratic reaction: reforms rolled back, and a more agreeable head found */
function doReaction(S){
  S._reactYears=0;
  /* power drains back to the throne */
  S.gov.institutions.forEach(inst=>{ powerToCrown(S,inst,Math.ceil(inst.power*0.6)); });
  S.gov.institutions=S.gov.institutions.filter(i=>i.power>0);
  if(S.pm){ S.pm=null; S._minority=false; }
  S.reforms=(S.reforms||[]).slice(0,Math.max(0,Math.ceil((S.reforms||[]).length*0.4)));
  S.facs.aristocracy.strength=clamp(S.facs.aristocracy.strength+8);
  S.legitPen=(S.legitPen||0)+8;
  /* a pliable member of the existing house if one can be found; a new house if not */
  const kin=pliableKin(S);
  if(kin){
    S.chronicle.push({year:S.year,cls:"rupture",text:`In ${S.year}, the great houses set aside the sovereign and raised ${kin.name} of the same blood in their place — a crowned signature for the restored order.`});
    crownPerson(kin,S.house,true);
  } else {
    const hs=(typeof housePool==="function"?housePool():["Vael"]).filter(h=>h!==S.house);
    const nh=pick(hs.length?hs:["Vael"]);
    const g=chance(0.7)?"m":"f";
    S.chronicle.push({year:S.year,cls:"rupture",text:`In ${S.year}, with no acceptable heir of the old blood, the great houses gave the crown to the House of ${nh}.`});
    crownPerson({id:PID++,name:nameFor(g,usedNames(S)),gender:g,age:26+rand(22)},nh,true);
  }
  refreshRelations(S);
}

/* =====================================================================
   LEGACY
   ===================================================================== */
function legacyScore(){
  const yrs=S.year-S.startYear;
  let s=0,n=0;for(const k in S.facs){if(S.facs[k].present){s+=S.facs[k].mood;n++;}}
  const avg=n?s/n:50;
  return Math.round(yrs*0.45+S.seenMilestones.length*16+S._reforms*9+S._successions*8+S._houseBreaks*6+S.development*0.4+(avg-50)*0.9);
}
function verdict(){
  if(S.gov.charter)return "A crown that knew when to bend. What began as an absolute throne became a realm of law its people had a hand in — and endured the better for it.";
  if(S._houseBreaks>0)return "The Houses rose and fell, but the throne — and the will behind it — went on. The chroniclers struggle to say what ruled the realm, and that is precisely the point.";
  if(S.gov.institutions.length>0)return "A monarchy that learned, grudgingly, to share the burden of power. The old absolutism is gone; something steadier stands in its place.";
  if(S._sameHouseSucc>=2)return "An unbroken absolute line, ruling as its founders did. Steadfastness or stubbornness — the chroniclers still argue.";
  return "A stewardship of an old realm through dangerous times, remembered in the measure of what it survived.";
}
function checkMilestones(){
  S._ms=S._ms||[];
  for(const m of MILESTONES){ if(!S.seenMilestones.includes(m.id)&&m.test(S)){ S.seenMilestones.push(m.id); S._ms.push(m.label);
    S.chronicle.push({year:S.year,cls:"mstone",text:`In ${S.year}, ${m.line}`}); } }
}

function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));}

function costChips(cost,fac,consentRight){
  let out="";const R={gold:"gold",arms:"Arms",stability:"Stability"};
  if(cost){for(const k of["gold","arms","stability"]){if(cost[k]){const up=cost[k]>0;out+=`<span class="chip ${up?"up":"down"}">${up?"+":""}${cost[k]} ${R[k]}</span>`;}}}
  if(fac){for(const k in fac){if(fac[k]&&S.facs[k]){const up=fac[k]>0;out+=`<span class="chip fac ${up?"up":"down"}">${S.facs[k].name} ${up?"+":""}${fac[k]}</span>`;}}}
  if(consentRight){const c=consentCheck(S,consentRight);if(c.required){out+=`<span class="chip consent">${esc(c.inst.name)}: standing ${Math.round(c.mood)} vs required ${Math.round(c.threshold)} — ${c.approve?"will grant":"will refuse"}</span>`;}}
  return out;
}
function meter(label,val,hue){const warn=val<=20?" warn":"";
  return `<div class="meter"><div class="mtop"><span class="mlbl">${label}</span><span class="mval" style="color:${hue}">${val}</span></div>
    <div class="track${warn}"><div class="fill" style="width:${val}%;background:${hue}"></div></div></div>`;}

function phaseStrip(){
  const steps=[];
  if(S.phase==="tidings")steps.push(["tidings","Tidings"]);
  if(S.phase==="election")steps.push(["election","Election"]);
  steps.push(["event","Event"],["court","Court"],["advance","Advancement"],["dynastic","Dynasty"]);
  if(S.phase==="dyncourt"||S.phase==="match"||S.phase==="designate")steps[steps.length-1]=["dyncourt","Dynasty"];
  return `<div class="phasestrip">${steps.map(([k,l])=>{
    const cls=(S.phase===k||(k==="event"&&S.phase==="quiet"))?"now":(S.phaseDone[k]?"done":"");
    return `<div class="phasestep ${cls}">${l}</div>`;}).join("")}</div>`;
}

function relLabel(p){
  // in-laws take their meaning from whoever they married — never stored, always derived
  if((p.rel==="inlaw"||p.rel==="childspouse")&&p.spouseId&&typeof S!=="undefined"&&S){
    const sp=(S.family||[]).find(x=>x.id===p.spouseId)||((S.ancestors||[]).find(x=>x.id===p.spouseId));
    if(sp&&sp.rel&&sp.rel!==p.rel){
      switch(sp.rel){
        case "child": return p.gender==="m"?"son-in-law":"daughter-in-law";
        case "sibling": return p.gender==="m"?"brother-in-law":"sister-in-law";
        case "uncle": return p.gender==="m"?"uncle by marriage":"aunt by marriage";
        case "nephew": return p.gender==="m"?"nephew by marriage":"niece by marriage";
        case "grandchild": return p.gender==="m"?"grandson-in-law":"granddaughter-in-law";
      }
    }
  }
  switch(p.rel){
    case "child": return p.gender==="m"?"son":"daughter";
    case "sibling": return p.gender==="m"?"brother":"sister";
    case "spouse": return "consort";
    case "dowager": return p.gender==="f"?"dowager":"consort dowager";
    case "uncle": return p.gender==="m"?"uncle":"aunt";
    case "childspouse": return p.gender==="m"?"son-in-law":"daughter-in-law";
    case "grandchild": return p.gender==="m"?"grandson":"granddaughter";
    case "inlaw": return p.gender==="m"?"brother-in-law":"sister-in-law";
    case "nephew": return p.gender==="m"?"nephew":"niece";
    case "former": return "of the old house";
    case "parent": return p.gender==="m"?"father":"mother";
    case "grandparent": return p.gender==="m"?"grandfather":"grandmother";
    default: return "cousin";
  }
}
function provincePanel(){
  const ps=provinces(S); if(!ps.length)return "";
  const lost=(S.lostProvinces||[]).length;
  return `<div class="provs"><div class="gt">The Country <span style="color:var(--dim);letter-spacing:.04em">— loyalty of each province</span></div>
    ${ps.map(p=>{
      const gov=p.governor?(S.family||[]).find(x=>x.id===p.governor&&x.alive):null;
      const cls=p.loyalty<24?"crit":p.loyalty<32?"warn":"";

  </div>`;
}
function familyPanel(){
  const rows=[]; const h=heirOf(S);
  const order={spouse:0,child:1,childspouse:2,grandchild:3,sibling:4,dowager:5,uncle:6,kin:7};
  const fam=S.family.filter(p=>!p.outHouse&&(p.alive||p.rel==="spouse"||p.rel==="child"||(p.diedTurn!=null&&S.turn-p.diedTurn<=2))).slice().sort((a,b)=>((order[a.rel]!=null?order[a.rel]:9)-(order[b.rel]!=null?order[b.rel]:9))||b.age-a.age);
  fam.forEach(p=>{ const tr=traitShown(p);

}

        <div class="grow"></div><span class="taxpill">Tax: ${TAX_TIERS[S.taxRate].label}</span>
      </div>
      <div class="budgetbreak">${budgetBreakdown(S)}</div>
      <div class="kbox"><span class="kk">Knowledge</span><span class="kv">${S.knowledge.toFixed(1)} <small style="color:var(--dim);font-size:10px">+${knowledgeIncome(S).toFixed(2)}/yr</small></span></div>
      <div class="legit-src" style="margin:7px 0 0">${legitSources(S)}</div>
      ${provincePanel()}
      <div class="facs"><div class="gt">The Powers of the Realm <span style="color:var(--dim);letter-spacing:.04em">— number = influence, bar = mood</span></div>${facHtml}</div>
    </aside>
    <section class="console">
